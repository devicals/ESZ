                    if (p < 1) {
                        axisRaf = requestAnimationFrame(step);
                    } else {
                        axisRaf = null;
                        stopServoSound();
                        targetBox.classList.add('is-flashing');
                    }
                }

                axisRaf = requestAnimationFrame(step);
                return travelMs;
            }

            function decryptEmail(enc) {
                if (!enc) return null;
                if (!enc.startsWith('enc_')) return enc;
                try {
                    const raw = atob(enc.replace('enc_', ''));
                    let result = '';
                    for (let i = 0; i < raw.length; i++) {
                        result += String.fromCharCode(raw.charCodeAt(i) ^ 42);
                    }
                    return result;
                } catch (e) {
                    return enc;
                }
            }

            function computeIsOwner(u) {
                if (!u || u.is_banned) return false;
                const name = (u.username || '').trim().toLowerCase();
                const email = (u.email || '').trim().toLowerCase();
                return u.is_owner === true || name === 'error dev' || email === OWNER_EMAIL.toLowerCase();
            }

            function syncOwnerStageClass() {
                const stage = document.getElementById('esz-stage');
                if (stage) stage.classList.toggle('is-owner', isOwner);
            }

            function readLocalAuthSync() {
                try {
                    const raw = localStorage.getItem('custom_auth_session');
                    if (!raw) {
                        sessionUser = null;
                        isOwner = false;
                        syncOwnerStageClass();
                        return null;
                    }
                    const parsed = JSON.parse(raw);
                    if (!parsed || parsed.is_banned) {
                        sessionUser = null;
                        isOwner = false;
                        syncOwnerStageClass();
                        return null;
                    }
                    if (parsed.email) parsed.email = decryptEmail(parsed.email);
                    sessionUser = parsed;
                    isOwner = computeIsOwner(parsed);
                    syncOwnerStageClass();
                    return parsed;
                } catch (e) {
                    sessionUser = null;
                    isOwner = false;
                    syncOwnerStageClass();
                    return null;
                }
            }

            async function verifyAuthWithDatabase() {
                const prevOwner = isOwner;
                const localUser = readLocalAuthSync();
                if (!localUser || !localUser.id) {
                    syncOwnerStageClass();
                    if (prevOwner !== isOwner && activeCoord && !isSpecialCoordKey(activeCoord.key)) {
                        renderSignalResults(false);
                    }
                    return;
                }
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .select('*')
                        .eq('id', localUser.id)
                        .maybeSingle();

                    if (error || !data || data.is_banned) {
                        sessionUser = null;
                        isOwner = false;
                    } else {
                        if (data.email) data.email = decryptEmail(data.email);
                        sessionUser = data;
                        isOwner = computeIsOwner(data);
                    }
                } catch (e) {}
                syncOwnerStageClass();
                if (prevOwner !== isOwner && activeCoord && !isSpecialCoordKey(activeCoord.key)) {
                    renderSignalResults(false);
                }
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'custom_auth_session') {
                    verifyAuthWithDatabase();
                } else if (e.key === RATE_KEY) {
                    startCooldownMonitor(false);
                } else if (e.key === LANG_STORE_KEY) {
                    const next = e.newValue === 'en' ? 'en' : 'ru';
                    if (next !== currentLang) {
                        currentLang = next;
                        applyLanguageUI();
                    }
                }
            });
            window.addEventListener('focus', () => {
                verifyAuthWithDatabase();
                applyCooldownStep();
            });
            window.addEventListener('resize', () => {
                buildeszBarrelMap();
                updateExpandLines();
                if (isCooldownActive() && !isEnteringCooldown) applyCooldownStep();
            });

            const COORD_REGEX = /^(?:[0-6]\d\.\d|70\.0)$/;
            let coordBoxes = [];

            function filledSlotCount(box) {
                let c = 0;
                for (let i = 0; i < 3; i++) {
                    if (box.slots[i] !== null) c++;
                }
                return c;
            }

            function isBoxOutOfRange(box) {
                const s0 = box.slots[0];
                const s1 = box.slots[1];
                const s2 = box.slots[2];
                if (s0 !== null) {
                    const d0 = parseInt(s0, 10);
                    if (d0 > 7) return true;
                    if (d0 === 7) {
                        if (s1 !== null && parseInt(s1, 10) > 0) return true;
                        if (s2 !== null && parseInt(s2, 10) > 0) return true;
                    }
                }
                return false;
            }

            function renderCoordBox(box) {
                const hasAny = filledSlotCount(box) > 0;
                box.el.classList.toggle('is-focused', box.focused);
                box.el.classList.toggle('is-invalid', box.invalid);
                box.el.classList.toggle('has-any', hasAny);

                for (let i = 0; i < 3; i++) {
                    const sEl = box.slotEls[i];
                    const val = box.slots[i];
                    sEl.textContent = val !== null ? val : '0';
                    sEl.classList.toggle('is-filled', val !== null);
                    sEl.classList.toggle('is-active', box.focused && box.activeSlot === i);
                }
            }

            function focusCoordBox(box, slotIndex) {
                if (isCooldownActive()) return;
                box.activeSlot = Math.max(0, Math.min(2, slotIndex));
                box.focused = true;
                renderCoordBox(box);
                box.inputEl.focus();
            }

            function normalizeBoxSlots(box) {
                if (isBoxOutOfRange(box)) return null;

                const s = box.slots;
                const count = filledSlotCount(box);
                if (count === 0) return null;

                let d0 = s[0];
                let d1 = s[1];
                let d2 = s[2];

                if (d0 !== null && d1 === null && d2 === null) {
                    if (d0 === '7') {
                        d1 = '0';
                        d2 = '0';
                    } else {
                        d1 = d0;
                        d0 = '0';
                        d2 = '0';
                    }
                } else if (d0 !== null && d1 !== null && d2 === null) {
                    d2 = '0';
                } else if (d0 === null && d1 !== null && d2 !== null) {
                    d0 = '0';
                } else if (d0 === null && d1 === null && d2 !== null) {
                    d0 = '0';
                    d1 = '0';
                } else if (d0 !== null && d1 === null && d2 !== null) {
                    d1 = d0;
                    d0 = '0';
                } else if (d0 === null && d1 !== null && d2 === null) {
                    d0 = '0';
                    d2 = '0';
                }

                const formatted = d0 + d1 + '.' + d2;
                if (!COORD_REGEX.test(formatted)) return null;
                return { formatted, slots: [d0, d1, d2] };
            }

            function normalizeCoordString(raw) {
                const s = (raw || '').trim();
                if (!s) return null;
                if (!/^\d{1,2}(?:\.\d?)?$/.test(s)) return null;
                const parts = s.split('.');
                const wholeNum = parseInt(parts[0], 10);
                const decNum = parts[1] ? parseInt(parts[1], 10) : 0;
                if (isNaN(wholeNum) || isNaN(decNum)) return null;
                const total = wholeNum + decNum / 10;
                if (total < 0 || total > 70) return null;
                const formatted = String(wholeNum).padStart(2, '0') + '.' + String(decNum);
                return COORD_REGEX.test(formatted) ? formatted : null;
            }

            function applyCharToBox(box, ch, otherBox, isFirstBox) {
                if (isCooldownActive() || !/[\d.]/.test(ch)) return;

                const prevCount = filledSlotCount(box);
                const pos = box.activeSlot;

                if (ch === '.') {
                    if (prevCount < 3) {
                        if (pos === 1 && box.slots[0] !== null && box.slots[1] === null) {
                            if (box.slots[0] === '7') {
                                box.slots[1] = '0';
                            } else {
                                box.slots[1] = box.slots[0];
                                box.slots[0] = '0';
                            }
                            box.activeSlot = 2;
                        } else if (pos < 2) {
                            box.activeSlot = 2;
                        }
                    } else if (pos < 2) {
                        box.activeSlot = 2;
                    }
                    box.invalid = isBoxOutOfRange(box);
                    if (!box.invalid) document.getElementById('coord-error').textContent = '';
                    else playTerminalErrorSound();
                    renderCoordBox(box);
                    playReedSwitchClick();
                    return;
                }

                if (prevCount === 3) {
                    box.slots[pos] = ch;
                    if (pos < 2) {
                        box.activeSlot = pos + 1;
                    }
                } else {
                    if (box.slots[pos] === null) {
                        box.slots[pos] = ch;
                    } else {
                        let rightEmpty = -1;
                        for (let i = pos + 1; i < 3; i++) {
                            if (box.slots[i] === null) {
                                rightEmpty = i;
                                break;
                            }
                        }
                        if (rightEmpty !== -1) {
                            for (let k = rightEmpty; k > pos; k--) {
                                box.slots[k] = box.slots[k - 1];
                            }
                            box.slots[pos] = ch;
                        } else {
                            let leftEmpty = -1;
                            for (let i = pos - 1; i >= 0; i--) {
                                if (box.slots[i] === null) {
                                    leftEmpty = i;
                                    break;
                                }
                            }
                            if (leftEmpty !== -1) {
                                for (let k = leftEmpty; k < pos; k++) {
                                    box.slots[k] = box.slots[k + 1];
                                }
                                box.slots[pos] = ch;
                            }
                        }
                    }

                    if (pos < 2) {
                        box.activeSlot = pos + 1;
                    }
                }

                box.invalid = isBoxOutOfRange(box);
                if (!box.invalid) document.getElementById('coord-error').textContent = '';
                else playTerminalErrorSound();

                renderCoordBox(box);
                playReedSwitchClick();

                if (isFirstBox && !box.invalid && prevCount < 3 && filledSlotCount(box) === 3 && otherBox) {
                    focusCoordBox(otherBox, 0);
                }
            }

            function initCoordBox(boxId, inputId, isFirstBox) {
                const el = document.getElementById(boxId);
                const inputEl = document.getElementById(inputId);
                const slotEls = [
                    el.querySelector('[data-slot="0"]'),
                    el.querySelector('[data-slot="1"]'),
                    el.querySelector('[data-slot="2"]')
                ];
                return {
                    el,
                    inputEl,
                    slotEls,
                    slots: [null, null, null],
                    activeSlot: 0,
                    focused: false,
                    invalid: false,
                    isFirstBox
                };
            }

            function bindCoordBoxEvents(box, otherBox) {
                const { inputEl, slotEls, isFirstBox } = box;

                inputEl.addEventListener('mousedown', (e) => {
                    if (isCooldownActive()) return;
                    playReedSwitchClick();
                    const r0 = slotEls[0].getBoundingClientRect();
                    const r1 = slotEls[1].getBoundingClientRect();
                    const r2 = slotEls[2].getBoundingClientRect();
                    const c0 = r0.left + r0.width * 0.5;
                    const c1 = r1.left + r1.width * 0.5;
                    const c2 = r2.left + r2.width * 0.5;
                    const x = e.clientX;
                    const d0 = Math.abs(x - c0);
                    const d1 = Math.abs(x - c1);
                    const d2 = Math.abs(x - c2);
                    if (d0 <= d1 && d0 <= d2) box.activeSlot = 0;
                    else if (d1 <= d2) box.activeSlot = 1;
                    else box.activeSlot = 2;
                    renderCoordBox(box);
                });

                inputEl.addEventListener('focus', () => {
                    if (isCooldownActive()) {
                        inputEl.blur();
                        return;
                    }
                    box.focused = true;
                    renderCoordBox(box);
                });

                inputEl.addEventListener('blur', () => {
                    box.focused = false;
                    if (filledSlotCount(box) > 0) {
                        const norm = normalizeBoxSlots(box);
                        if (norm) {
                            box.slots = norm.slots;
                            box.invalid = false;
                        } else {
                            box.invalid = true;
                        }
                    } else {
                        box.invalid = false;
                    }
                    renderCoordBox(box);
                });

                inputEl.addEventListener('beforeinput', (e) => {
                    if (isCooldownActive()) {
                        e.preventDefault();
                        return;
                    }
                    if (e.inputType === 'insertFromPaste') return;
                    if (e.inputType === 'insertText' && e.data) {
                        e.preventDefault();
                        for (let i = 0; i < e.data.length; i++) {
                            applyCharToBox(box, e.data[i], otherBox, isFirstBox);
                        }
                    }
                });

                inputEl.addEventListener('input', () => {
                    const raw = inputEl.value;
                    inputEl.value = '';
                    if (!raw || isCooldownActive()) return;
                    for (let i = 0; i < raw.length; i++) {
                        applyCharToBox(box, raw[i], otherBox, isFirstBox);
                    }
                });

                inputEl.addEventListener('paste', (e) => {
                    e.preventDefault();
                    if (isCooldownActive()) return;
                    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
                    const norm = normalizeCoordString(text);
                    const prevCount = filledSlotCount(box);
                    if (norm) {
                        box.slots = [norm[0], norm[1], norm[3]];
                        box.activeSlot = 2;
                        box.invalid = false;
                        document.getElementById('coord-error').textContent = '';
                        renderCoordBox(box);
                        playReedSwitchClick();
                        if (isFirstBox && prevCount < 3 && otherBox) {
                            focusCoordBox(otherBox, 0);
                        }
                    } else {
                        for (let i = 0; i < text.length; i++) {
                            applyCharToBox(box, text[i], otherBox, isFirstBox);
                        }
                    }
                });

                inputEl.addEventListener('keydown', (e) => {
                    if (isCooldownActive()) {
                        e.preventDefault();
                        return;
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = Math.max(0, box.activeSlot - 1);
                        renderCoordBox(box);
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = Math.min(2, box.activeSlot + 1);
                        renderCoordBox(box);
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = 0;
                        renderCoordBox(box);
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = 2;
                        renderCoordBox(box);
                    } else if (e.key === 'Backspace') {
                        e.preventDefault();
                        playReedSwitchClick();
                        if (box.slots[box.activeSlot] !== null) {
                            box.slots[box.activeSlot] = null;
                        } else if (box.activeSlot > 0) {
                            box.activeSlot--;
                            box.slots[box.activeSlot] = null;
                        } else if (!isFirstBox && filledSlotCount(box) === 0 && otherBox) {
                            focusCoordBox(otherBox, 2);
                            return;
                        }
                        box.invalid = isBoxOutOfRange(box);
                        if (!box.invalid) document.getElementById('coord-error').textContent = '';
                        else playTerminalErrorSound();
                        renderCoordBox(box);
                    } else if (e.key === 'Delete') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.slots[box.activeSlot] = null;
                        box.invalid = isBoxOutOfRange(box);
                        if (!box.invalid) document.getElementById('coord-error').textContent = '';
                        else playTerminalErrorSound();
                        renderCoordBox(box);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        playSovietRelayClunk();
                        triggerCoordinateLookup();
                    } else if (e.key === ',' && isFirstBox && otherBox) {
                        e.preventDefault();
                        playReedSwitchClick();
                        focusCoordBox(otherBox, 0);
                    }
                });

                renderCoordBox(box);
            }

            function escapeHTML(str) {
                return (str || '').toString()
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function isSafeUrl(url) {
                const u = (url || '').trim();
                if (!u) return false;
                if (/^(https?:\/\/|\/|\.\/|\.\.\/)/i.test(u)) return true;
                if (/^data:(image|video|audio)\/[a-z0-9.+-]+;base64,/i.test(u)) return true;
                return false;
            }

            function buildMorseTimeline(morseStr) {
                const UNIT = 0.075;
                const tones = [];
                const clean = (morseStr || '').trim().replace(/\r?\n/g, ' / ');
                let t = 0;
                let i = 0;

                while (i < clean.length) {
                    const ch = clean[i];
                    if (ch === '.') {
                        tones.push({ start: t, end: t + UNIT });
                        t += UNIT * 2;
                    } else if (ch === '-') {
                        tones.push({ start: t, end: t + UNIT * 3 });
                        t += UNIT * 4;
                    } else if (ch === '/') {
                        t += UNIT * 4;
                    } else if (ch === ' ' || ch === '\t') {
                        while (i + 1 < clean.length && (clean[i + 1] === ' ' || clean[i + 1] === '\t')) i++;
                        t += UNIT * 2;
                    }
                    i++;
                }
                return { tones, totalSec: t };
            }

            let activePlayback = null;

            function stopMorsePlayback() {
                if (!activePlayback) return;
                const prev = activePlayback;
                activePlayback = null;

                if (prev.pollId) clearInterval(prev.pollId);
                if (prev.osc && prev.gain && audioCtx) {
                    try {
                        const now = audioCtx.currentTime;
                        prev.gain.gain.cancelScheduledValues(now);
                        prev.gain.gain.setValueAtTime(prev.gain.gain.value, now);
                        prev.gain.gain.linearRampToValueAtTime(0, now + 0.008);
                        prev.osc.stop(now + 0.012);
                    } catch (e) {}
                }

                const btn = document.getElementById('morse-btn-' + prev.id);
                const status = document.getElementById('morse-carrier-' + prev.id);
                if (btn) {
                    btn.textContent = tr('morsePlay');
                    btn.classList.remove('is-playing');
                }
                if (status) {
                    status.textContent = tr('standby');
                    status.classList.remove('is-tx');
                }
            }

            function toggleMorsePlayback(packetId) {
                playSovietRelayClunk();
                if (activePlayback && activePlayback.id === packetId) {
                    stopMorsePlayback();
                    return;
                }

                stopMorsePlayback();
                stopPipPlayback();
                stopBuzzerPlayback();
                stopE07Playback();

                const packet = currentPackets.find(p => p.id === packetId);
                if (!packet) return;

                const { tones, totalSec } = buildMorseTimeline(packet.content || '');
                if (!tones.length || totalSec <= 0) return;

                const ctx = ensureAudioContext();
                if (!ctx) return;

                const startAt = ctx.currentTime + 0.02;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(640, startAt);
                gain.gain.setValueAtTime(0, startAt);

                for (let i = 0; i < tones.length; i++) {
                    const t0 = startAt + tones[i].start;
                    const t1 = startAt + tones[i].end;
                    gain.gain.setValueAtTime(0, t0);
                    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.004);
                    gain.gain.setValueAtTime(0.18, Math.max(t0 + 0.004, t1 - 0.004));
                    gain.gain.linearRampToValueAtTime(0, t1);
                }

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startAt);
                osc.stop(startAt + totalSec + 0.02);

                const btn = document.getElementById('morse-btn-' + packetId);
                const status = document.getElementById('morse-carrier-' + packetId);
                if (btn) {
                    btn.textContent = tr('morseStop');
                    btn.classList.add('is-playing');
                }
                if (status) {
                    status.textContent = tr('carrierLow');
                    status.classList.add('is-tx');
                }

                const state = { id: packetId, osc, gain, pollId: null };
                activePlayback = state;

                state.pollId = setInterval(() => {
                    if (activePlayback !== state) return;
                    const elapsed = ctx.currentTime - startAt;
                    if (elapsed >= totalSec) {
                        stopMorsePlayback();
                        return;
                    }
                    let high = false;
                    for (let i = 0; i < tones.length; i++) {
                        if (elapsed >= tones[i].start && elapsed <= tones[i].end) {
                            high = true;
                            break;
                        }
                        if (tones[i].start > elapsed) break;
                    }
                    const sEl = document.getElementById('morse-carrier-' + packetId);
                    if (sEl) {
                        sEl.textContent = high ? tr('carrierHigh') : tr('carrierLow');
                    }
                }, 30);
            }

            const IMA_INDEX_TABLE = [-1, -1, -1, -1, 2, 4, 6, 8, -1, -1, -1, -1, 2, 4, 6, 8];
            const IMA_STEP_TABLE = [
                7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45,
                50, 55, 60, 66, 73, 80, 88, 97, 107, 118, 130, 143, 157, 173, 190, 209, 230,
                253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796, 876, 963,
                1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327,
                3660, 4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487,
                12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623, 27086, 29794, 32767
            ];

            function decodeImaAdpcmToFloat(data, state) {
                const out = new Float32Array(data.length * 2);
                let pos = 0;
                for (let i = 0; i < data.length; i++) {
                    const byte = data[i];
                    for (let shift = 0; shift <= 4; shift += 4) {
                        const code = (byte >> shift) & 0x0f;
                        const step = IMA_STEP_TABLE[state.index];
                        let diff = step >> 3;
                        if (code & 1) diff += step >> 2;
                        if (code & 2) diff += step >> 1;
                        if (code & 4) diff += step;
                        if (code & 8) state.pred -= diff;
                        else state.pred += diff;
                        if (state.pred > 32767) state.pred = 32767;
                        else if (state.pred < -32768) state.pred = -32768;
                        state.index += IMA_INDEX_TABLE[code];
                        if (state.index < 0) state.index = 0;
                        else if (state.index > 88) state.index = 88;
                        out[pos++] = state.pred / 32768;
                    }
                }
                return out;
            }

            const DEFAULT_TUNER_SETTINGS = {
                pip: { volume: 135, highCut: 1750, nr: 30, agcThresh: -100 },
                s28: { volume: 105, highCut: 1900, nr: 20, agcThresh: -95 },
                e07: { volume: 115, highCut: 2200, nr: 25, agcThresh: -100 }
            };

            function readAllTunerSettings() {
                try {
                    const raw = localStorage.getItem(TUNER_STORE_KEY);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (e) {
                    return {};
                }
            }

            function getTunerSettings(station) {
                const base = DEFAULT_TUNER_SETTINGS[station] || DEFAULT_TUNER_SETTINGS.s28;
                const saved = readAllTunerSettings()[station];
                if (!saved || typeof saved !== 'object') return { ...base };
                return {
                    volume: typeof saved.volume === 'number' ? Math.max(0, Math.min(200, saved.volume)) : base.volume,
                    highCut: typeof saved.highCut === 'number' ? Math.max(800, Math.min(5000, saved.highCut)) : base.highCut,
                    nr: typeof saved.nr === 'number' ? Math.max(0, Math.min(100, saved.nr)) : base.nr,
                    agcThresh: typeof saved.agcThresh === 'number' ? Math.max(-110, Math.min(-65, saved.agcThresh)) : base.agcThresh
                };
            }

            function saveTunerSettings(station, vals) {
                try {
                    const all = readAllTunerSettings();
                    all[station] = {
                        volume: vals.volume,
                        highCut: vals.highCut,
                        nr: vals.nr,
                        agcThresh: vals.agcThresh
                    };
                    localStorage.setItem(TUNER_STORE_KEY, JSON.stringify(all));
                } catch (e) {}
            }

            function bindRadioTunerEvents(station, state) {
                const volEl = document.getElementById('tuner-vol');
                const bwEl = document.getElementById('tuner-bw');
                const nrEl = document.getElementById('tuner-nr');
                const agcEl = document.getElementById('tuner-agc');
                const volVal = document.getElementById('tuner-vol-val');
                const bwVal = document.getElementById('tuner-bw-val');
                const nrVal = document.getElementById('tuner-nr-val');
                const agcVal = document.getElementById('tuner-agc-val');
                const resetBtn = document.getElementById('tuner-reset-btn');
                if (!volEl || !bwEl || !nrEl || !agcEl) return;

                let kiwiSendTimer = null;

                const pushKiwiTuning = () => {
                    if (kiwiSendTimer) clearTimeout(kiwiSendTimer);
                    kiwiSendTimer = setTimeout(() => {
                        kiwiSendTimer = null;
                        const ws = state.activeWs;
                        const cfg = state.activeCfg;
                        if (ws && cfg && ws.readyState === WebSocket.OPEN) {
                            try {
                                ws.send(`SET mod=usb low_cut=${cfg.lowCut} high_cut=${cfg.highCut} freq=${Number(cfg.freqKhz).toFixed(2)}`);
                                ws.send(`SET agc=1 hang=1 thresh=${cfg.agcThresh} slope=6 decay=${cfg.agcDecay} manGain=50`);
                            } catch (e) {}
                        }
                    }, 90);
                };

                const applyCurrentSliders = (sendToKiwi) => {
                    const volume = parseInt(volEl.value, 10);
                    const highCut = parseInt(bwEl.value, 10);

                    const agcThresh = parseInt(agcEl.value, 10);

                    if (nrVal) nrVal.textContent = `${nr}%`;
                    if (agcVal) agcVal.textContent = `${agcThresh} ${tr('unitDbm')}`;

                    saveTunerSettings(station, { volume, highCut, nr, agcThresh });

                    if (state.activeCfg) {
                        state.activeCfg.outLevel = volume / 100;
                        state.activeCfg.highCut = highCut;
                        state.activeCfg.nr = nr;
                        state.activeCfg.agcThresh = agcThresh;
                    }

                    if (audioCtx) {
                        const now = audioCtx.currentTime;
                        if (radioOutGain) radioOutGain.gain.setValueAtTime(volume / 100, now);
                        if (radioLp1) radioLp1.frequency.setValueAtTime(highCut, now);
                        if (radioLp2) radioLp2.frequency.setValueAtTime(highCut, now);
                    }

                    if (sendToKiwi) pushKiwiTuning();
                };

                volEl.addEventListener('input', () => applyCurrentSliders(false));
                nrEl.addEventListener('input', () => applyCurrentSliders(false));
                bwEl.addEventListener('input', () => applyCurrentSliders(true));
                agcEl.addEventListener('input', () => applyCurrentSliders(true));

                if (resetBtn) {
                    resetBtn.addEventListener('click', () => {
                        playReedSwitchClick();
                        const def = DEFAULT_TUNER_SETTINGS[station] || DEFAULT_TUNER_SETTINGS.s28;
                        volEl.value = String(def.volume);
                        bwEl.value = String(def.highCut);
                        nrEl.value = String(def.nr);
                        agcEl.value = String(def.agcThresh);
                        applyCurrentSliders(true);
                    });
                }
            }

            async function getKiwiHostList(station) {
                const now = Date.now();
                const entry = cachedHostsByStation[station];
                if (entry && now - entry.at < 180000) {
                    return entry.hosts;
                }
                const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const t = ac ? setTimeout(() => ac.abort(), 2500) : null;
                try {
                    const res = await fetch(`${WORKER_BASE}?action=hosts&station=${encodeURIComponent(station)}`, {
                        signal: ac ? ac.signal : undefined,
                        cache: 'no-store'
                    });
                    if (t) clearTimeout(t);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && Array.isArray(data.hosts) && data.hosts.length > 0) {
                            cachedHostsByStation[station] = { hosts: data.hosts, at: now };
                            return data.hosts;
                        }
                    }
                } catch (e) {
                    if (t) clearTimeout(t);

            function updateRadioUI(state, btnId, statusId, barId) {

            function cleanupLiveRadio(state, targetPhase, updateUiFn) {
                state.sessionId = (state.sessionId || 0) + 1;
                state.playing = false;
                state.phase = targetPhase || 'standby';
                state.retryCount = 0;
                state.activeHost = null;
                stopWaveLoop();

                if (state.keepaliveTimer) {
                    clearInterval(state.keepaliveTimer);
                    state.keepaliveTimer = null;
                }

                if (state.stableTimer) {
                    clearTimeout(state.stableTimer);
                    state.stableTimer = null;
                }

                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }

                if (state.activeWs) {
                    try { state.activeWs.close(); } catch (e) {}
                    state.activeWs = null;
                }

                if (state.sockets) {
                    state.sockets.forEach(s => {
                        try { s.close(); } catch (e) {}
                    });
                    state.sockets.clear();
                    state.sockets = null;
                }

                if (state.sources) {
                    state.sources.forEach(src => {
                        try { src.stop(); } catch (e) {}
                    });
                    state.sources.clear();
                    state.sources = null;
                }

                updateUiFn();
                drawWaveOnce(false, false);
            }

            function handleLiveDrop(state, cfg, droppedHost, updateUiFn, sessionId) {
                if (state.sessionId !== sessionId || !state.playing) return;
                const nextSessionId = sessionId + 1;
                state.sessionId = nextSessionId;

                if (droppedHost) {
                    hostCooldownUntil.set(droppedHost, Date.now() + 180000);
                }

                const retries = (state.retryCount || 0) + 1;
                if (retries > 6) {
                    playTerminalErrorSound();
                    cleanupLiveRadio(state, 'error', updateUiFn);
                    return;
                }

                if (state.keepaliveTimer) {
                    clearInterval(state.keepaliveTimer);
                    state.keepaliveTimer = null;
                }
                if (state.stableTimer) {
                    clearTimeout(state.stableTimer);
                    state.stableTimer = null;
                }
                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }
                if (state.activeWs) {
                    try { state.activeWs.close(); } catch (e) {}
                    state.activeWs = null;
                }
                if (state.sources) {
                    state.sources.forEach(src => {
                        try { src.stop(); } catch (e) {}
                    });
                    state.sources.clear();
                }

                state.activeHost = null;
                state.retryCount = retries;
                state.phase = 'connecting';
                updateUiFn();

                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    if (state.sessionId !== nextSessionId || !state.playing) return;
                    startLiveRadio(state, cfg, updateUiFn, true, retries);
                }, 300);
            }

            function connectKiwiWebSocket(host, cfg, state, sessionId, raceState, ctx, destNode, updateUiFn) {
                return new Promise((resolve, reject) => {
                    if (state.sessionId !== sessionId || raceState.won) {
                        reject(new Error('cancelled'));
                        return;
                    }

                    const wsBase = WORKER_BASE.replace(/^http/i, 'ws').replace(/\/+$/, '');
                    const wsUrl = `${wsBase}/?action=ws&host=${encodeURIComponent(host)}&_t=${Date.now()}`;
                    let ws;
                    try {
                        ws = new WebSocket(wsUrl);
                    } catch (e) {
                        reject(e);
                        return;
                    }

                    ws.binaryType = 'arraybuffer';
                    if (state.sockets) state.sockets.add(ws);

                    const decoder = new TextDecoder();
                    const adpcmState = { pred: 0, index: 0 };
                    const nrState = { envFast: 0.02, envFloor: 0.02, curGain: 1.0 };
                    let sampleRate = 12000;
                    let tuningSent = false;
                    let gotAudio = false;
                    let isWinner = false;
                    let closed = false;
                    let dropHandled = false;
                    let nextPlayTime = 0;
                    let sampleAcc = new Float32Array(0);
                    let fallbackTuneTimer = null;

                    const cleanupSelf = () => {
                        if (closed) return;
                        closed = true;
                        clearTimeout(waitTimer);
                        if (fallbackTuneTimer) {
                            clearTimeout(fallbackTuneTimer);
                            fallbackTuneTimer = null;
                        }
                        if (state.sockets) state.sockets.delete(ws);
                        try { ws.close(); } catch (e) {}
                    };

                    const triggerDrop = () => {
                        if (dropHandled) return;
                        dropHandled = true;
                        cleanupSelf();
                        if (!isWinner) {
                            reject(new Error('dropped'));
                        } else {
                            handleLiveDrop(state, cfg, host, updateUiFn, sessionId);
                        }
                    };

                    const sendTuningOnce = (rate) => {
                        if (tuningSent || closed || ws.readyState !== WebSocket.OPEN) return;
                        tuningSent = true;
                        if (fallbackTuneTimer) {
                            clearTimeout(fallbackTuneTimer);
                            fallbackTuneTimer = null;
                        }
                        try {
                            ws.send(`SET AR OK in=${rate} out=44100`);
                            ws.send('SET ident_user=Web');
                            ws.send('SET compression=0');
                            ws.send('SET squelch=0 max=0');
                            ws.send('SET genattn=0');
                            ws.send('SET gen=0 mix=-1');
                            ws.send(`SET mod=usb low_cut=${cfg.lowCut} high_cut=${cfg.highCut} freq=${Number(cfg.freqKhz).toFixed(2)}`);
                            ws.send(`SET agc=1 hang=1 thresh=${cfg.agcThresh} slope=6 decay=${cfg.agcDecay} manGain=50`);
                            ws.send('SET keepalive');
                        } catch (e) {}
                    };

                    const applyAdaptiveNoiseReduction = (samples) => {
                        const nrPct = typeof cfg.nr === 'number' ? cfg.nr : 0;
                        if (nrPct <= 0) return samples;
                        const nrAmt = Math.max(0, Math.min(1, nrPct / 100));
                        const knee = 1.05 + nrAmt * 1.35;
                        const minGain = 1.0 - nrAmt * 0.92;
                        const out = new Float32Array(samples.length);

                        for (let i = 0; i < samples.length; i++) {
                            const s = samples[i];
                            const a = s < 0 ? -s : s;
                            if (a > nrState.envFast) {
                                nrState.envFast += (a - nrState.envFast) * 0.02;
                            } else {
                                nrState.envFast += (a - nrState.envFast) * 0.0012;
                            }
                            if (nrState.envFast < nrState.envFloor) {
                                nrState.envFloor += (nrState.envFast - nrState.envFloor) * 0.0015;
                            } else {
                                nrState.envFloor += (nrState.envFast - nrState.envFloor) * 0.00004;
                            }
                            const floorVal = nrState.envFloor > 0.002 ? nrState.envFloor : 0.002;
                            const ratio = nrState.envFast / floorVal;
                            let targetGain = 1.0;
                            if (ratio < knee) {
                                const t = Math.max(0, Math.min(1, (ratio - 0.85) / Math.max(0.1, knee - 0.85)));
                                targetGain = minGain + (1.0 - minGain) * t * t;
                            }
                            nrState.curGain += (targetGain - nrState.curGain) * 0.008;
                            out[i] = s * nrState.curGain;
                        }
                        return out;
                    };

                    const scheduleFloats = (floats) => {
                        if (state.sessionId !== sessionId || !state.playing) return;
                        if (ctx.state === 'suspended') {
                            ctx.resume().catch(() => {});
                        }

                        const processed = applyAdaptiveNoiseReduction(floats);
                        const merged = new Float32Array(sampleAcc.length + processed.length);
                        merged.set(sampleAcc, 0);
                        merged.set(processed, sampleAcc.length);
                        sampleAcc = merged;

                        const chunkSamples = Math.max(600, Math.round(sampleRate * 0.1));
                        while (sampleAcc.length >= chunkSamples) {
                            const piece = sampleAcc.subarray(0, chunkSamples);
                            const buf = ctx.createBuffer(1, chunkSamples, sampleRate);
                            buf.getChannelData(0).set(piece);
                            sampleAcc = sampleAcc.slice(chunkSamples);

                            const src = ctx.createBufferSource();
                            src.buffer = buf;
                            src.connect(destNode);
                            if (state.sources) state.sources.add(src);
                            src.onended = () => {
                                if (state.sources) state.sources.delete(src);
                            };

                            const now = ctx.currentTime;
                            if (nextPlayTime < now + 0.03 || nextPlayTime > now + 1.4) {
                                nextPlayTime = now + 0.35;
                            }
                            src.start(nextPlayTime);
                            nextPlayTime += buf.duration;
                        }
                    };

                    const waitTimer = setTimeout(() => {
                        if (!gotAudio) {
                            cleanupSelf();
                            reject(new Error('timeout'));
                        }
                    }, 4500);

                    ws.addEventListener('open', () => {
                        if (closed || state.sessionId !== sessionId || raceState.won) {
                            cleanupSelf();
                            reject(new Error('cancelled'));
                            return;
                        }
                        try {
                            ws.send('SET auth t=kiwi p=#');
                            fallbackTuneTimer = setTimeout(() => {
                                sendTuningOnce(sampleRate);
                            }, 700);
                        } catch (e) {
                            cleanupSelf();
                            reject(e);
                        }
                    });

                    ws.addEventListener('message', (ev) => {
                        if (closed || state.sessionId !== sessionId) return;

                        let bytes = null;
                        let textMsg = null;

                        if (typeof ev.data === 'string') {
                            textMsg = ev.data;
                        } else if (ev.data instanceof ArrayBuffer) {
                            bytes = new Uint8Array(ev.data);
                            if (bytes.length >= 4 && bytes[0] === 0x4d && bytes[1] === 0x53 && bytes[2] === 0x47) {
                                textMsg = decoder.decode(bytes.subarray(4));
                            }
                        }

                        if (textMsg !== null) {
                            if (
                                textMsg.startsWith('load_cfg=') ||
                                textMsg.startsWith('load_dxcfg=') ||
                                textMsg.startsWith('load_adm=') ||
                                textMsg.startsWith('load_dxcomm_cfg=')
                            ) {
                                return;
                            }

                            const isHardReject =
                                /(?:^|\s)too_busy=[1-9]/.test(textMsg) ||
                                /(?:^|\s)down=1(?:\s|$)/.test(textMsg) ||
                                /(?:^|\s)badp=[1-9]/.test(textMsg) ||
                                /(?:^|\s)inactivity_timeout=[1-9]/.test(textMsg) ||
                                /(?:^|\s)kick_by_admin(?:\s|=|$)/.test(textMsg) ||
                                /(?:^|\s)redirect=https?:/i.test(textMsg);

                            if (isHardReject) {
                                triggerDrop();
                                return;
                            }

                            const srMatch = textMsg.match(/(?:sample_rate|audio_rate)=([0-9.]+)/);
                            if (srMatch) {
                                const parsed = Math.round(parseFloat(srMatch[1]));
                                sampleRate = parsed > 16000 ? 20250 : 12000;
                                sendTuningOnce(sampleRate);
                            } else if (textMsg.includes('cfg_loaded')) {
                                sendTuningOnce(sampleRate);
                            }
                            return;
                        }

                        if (bytes && bytes.length > 10 && bytes[0] === 0x53 && bytes[1] === 0x4e && bytes[2] === 0x44) {
                            if (!gotAudio) {
                                if (raceState.won || state.sessionId !== sessionId) {
                                    cleanupSelf();
                                    reject(new Error('lost race'));
                                    return;
                                }
                                raceState.won = true;
                                gotAudio = true;
                                isWinner = true;
                                clearTimeout(waitTimer);
                                state.activeWs = ws;
                                state.activeHost = host;
                                state.keepaliveTimer = setInterval(() => {
                                    if (closed || state.sessionId !== sessionId || ws.readyState !== WebSocket.OPEN) {
                                        if (state.keepaliveTimer) {
                                            clearInterval(state.keepaliveTimer);
                                            state.keepaliveTimer = null;
                                        }
                                        return;
                                    }
                                    try { ws.send('SET keepalive'); } catch (e) {}
                                }, 4000);
                                state.stableTimer = setTimeout(() => {
                                    if (state.sessionId === sessionId && state.playing) {
                                        state.retryCount = 0;
                                    }
                                }, 20000);
                                state.phase = 'live';
                                updateUiFn();
                                resolve(ws);
                            }

                            const flags = bytes[3];
                            const isCompressed = (flags & 0x10) !== 0;
                            const isRestart = (flags & 0x20) !== 0;
                            const isLittleEndian = (flags & 0x80) !== 0;

                            if (isRestart) {
                                adpcmState.pred = 0;
                                adpcmState.index = 0;
                            }

                            let floats;
                            if (isCompressed) {
                                floats = decodeImaAdpcmToFloat(bytes.subarray(10), adpcmState);
                            } else {
                                const count = (bytes.length - 10) >> 1;
                                if (count <= 0) return;
                                const view = new DataView(bytes.buffer, bytes.byteOffset + 10, count * 2);
                                floats = new Float32Array(count);
                                for (let i = 0; i < count; i++) {
                                    floats[i] = view.getInt16(i * 2, isLittleEndian) / 32768;
                                }
                            }
                            scheduleFloats(floats);
                        }
                    });

                    ws.addEventListener('close', triggerDrop);
                    ws.addEventListener('error', triggerDrop);
                });
            }

            async function startLiveRadio(state, cfg, updateUiFn, rotateOffset, retryCarry) {
                const sessionId = (state.sessionId || 0) + 1;
                state.sessionId = sessionId;
                state.activeCfg = cfg;
                state.playing = true;
                state.phase = 'connecting';
                state.activeHost = null;
                state.retryCount = retryCarry || 0;
                state.sockets = new Set();
                state.sources = new Set();
                updateUiFn();
                startWaveLoop(() => state);

                const ctx = ensureAudioContext();
                const destNode = getRadioChain(cfg.lowCut, cfg.highCut, cfg.peakFreq, cfg.peakGainDb, cfg.outLevel);
                if (!ctx || !destNode) {
                    playTerminalErrorSound();
                    cleanupLiveRadio(state, 'error', updateUiFn);
                    return;
                }

                const rawHosts = await getKiwiHostList(cfg.station);
                if (state.sessionId !== sessionId || !state.playing) return;

                const now = Date.now();
                const freshHosts = rawHosts.filter(h => (hostCooldownUntil.get(h) || 0) <= now);
                const pool = freshHosts.length > 0 ? freshHosts : rawHosts;

                if (rotateOffset && pool.length > 1) {
                    state.hostOffset = ((state.hostOffset || 0) + 1) % pool.length;
                } else if (!rotateOffset) {
                    state.hostOffset = 0;
                }

                const off = (state.hostOffset || 0) % Math.max(1, pool.length);
                const hosts = off > 0 ? [...pool.slice(off), ...pool.slice(0, off)] : pool;
                const batches = [hosts.slice(0, 4), hosts.slice(4, 8), hosts.slice(8, 12)].filter(b => b.length > 0);

                for (const batch of batches) {
                    if (state.sessionId !== sessionId || !state.playing) return;
                    const raceState = { won: false };
                    try {
                        const winnerWs = await Promise.any(
                            batch.map(h => connectKiwiWebSocket(h, cfg, state, sessionId, raceState, ctx, destNode, updateUiFn))
                        );
                        if (state.sockets) {
                            state.sockets.forEach(s => {
                                if (s !== winnerWs) {
                                    try { s.close(); } catch (e) {}
                                }
                            });
                        }
                        return;
                    } catch (e) {}
                }

                if (state.sessionId === sessionId && state.playing) {
                    playTerminalErrorSound();
                    cleanupLiveRadio(state, 'error', updateUiFn);
                }
            }

            let pipState = { sessionId: 0, hostOffset: 0, retryCount: 0, playing: false, phase: 'standby', freqLabel: '5448 kHz USB', activeCfg: null, activeWs: null, activeHost: null, sockets: null, sources: null, keepaliveTimer: null, stableTimer: null, reconnectTimer: null };

            function isPipDaytimeUtc(now) {
                const m = now.getUTCMonth() + 1;
                const mins = now.getUTCHours() * 60 + now.getUTCMinutes();
                if (m === 11 || m === 12 || m <= 2) return mins >= 330 && mins < 840;
                if (m === 3 || m === 4) return mins >= 270 && mins < 960;
                if (m >= 5 && m <= 8) return mins >= 180 && mins < 1050;
                return mins >= 270 && mins < 990;
            }

            const E07_SLOT_DURATION_MS = 15 * 60 * 1000;

                { day: 5, hour: 15, min: 0,  freqKhz: 17461, label: 'Tue/Fri' },
                { day: 5, hour: 15, min: 20, freqKhz: 16161, label: 'Tue/Fri' },
                { day: 5, hour: 15, min: 40, freqKhz: 14361, label: 'Tue/Fri (traffic)' },

            ];

            let e07State = {
                sessionId: 0,
                hostOffset: 0,
                retryCount: 0,
                schedule: null,
                targetMs: null,
                activeEndStr: null,
                countdownTimer: null,
                playing: false,
                phase: 'standby',
                activeCfg: null,
                activeWs: null,
                activeHost: null,
                sockets: null,
                sources: null,
                keepaliveTimer: null,
                stableTimer: null,
                reconnectTimer: null
            };

            function computeLocalE07Schedule(nowMs) {
                const baseDate = new Date(nowMs);
                const startDayMs = Date.UTC(baseDate.getUTCFullYear(), baseDate.getUTCMonth(), baseDate.getUTCDate() - 1, 0, 0, 0, 0);
                const slots = [];
                for (let dOffset = 0; dOffset <= 9; dOffset++) {
                    const dayMs = startDayMs + dOffset * 86400000;
                    const dow = new Date(dayMs).getUTCDay();
                    for (const rule of E07_FALLBACK_RULES) {
                        if (rule.day === dow) {
                            const startUtcMs = dayMs + (rule.hour * 60 + rule.min) * 60000;
                            slots.push({
                                startUtcMs,
                                endUtcMs: startUtcMs + E07_SLOT_DURATION_MS,
                                freqKhz: rule.freqKhz,
                                mode: 'USB',
                                label: rule.label,
                                remarks: ''
                            });
                        }
                    }
                }
                slots.sort((a, b) => a.startUtcMs - b.startUtcMs);
                const activeSlot = slots.find(s => nowMs >= s.startUtcMs && nowMs < s.endUtcMs) || null;
                const upcoming = slots.filter(s => s.startUtcMs > nowMs).slice(0, 6);
                return {
                    station: 'E07',
                    name: 'English Man',
                    nowUtcMs: nowMs,
                    active: !!activeSlot,
                    activeSlot,
                    nextSlot: upcoming[0] || null,
                    upcoming,
                    source: 'local-fallback'
                };
            }

            async function fetchE07Schedule() {
                const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const t = ac ? setTimeout(() => ac.abort(), 3200) : null;
                try {
                    const res = await fetch(`${WORKER_BASE}?station=e07&action=schedule`, {
                        signal: ac ? ac.signal : undefined,
                        cache: 'no-store'
                    });
                    if (t) clearTimeout(t);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.station === 'E07') {
                            return data;
                        }
                    }
                } catch (e) {
                    if (t) clearTimeout(t);
                }
                return computeLocalE07Schedule(Date.now());
            }

            function formatUtcSlot(ms) {
                const d = new Date(ms);
                const dd = String(d.getUTCDate()).padStart(2, '0');
                const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
                const hh = String(d.getUTCHours()).padStart(2, '0');
                const mm = String(d.getUTCMinutes()).padStart(2, '0');
                return `${dd}.${mo} ${hh}:${mm} UTC`;
            }

            function formatCountdownHHMM(diffMs) {
                if (diffMs <= 0) return '00:00';
                const totalMins = diffMs < 60000 ? 1 : Math.floor(diffMs / 60000);
                const hh = String(Math.floor(totalMins / 60)).padStart(2, '0');
                const mm = String(totalMins % 60).padStart(2, '0');
                return `${hh}:${mm}`;
            }

            function stopE07Countdown() {
                if (e07State.countdownTimer) {

                }
                const nextSlot = sched.nextSlot || (Array.isArray(sched.upcoming) ? sched.upcoming.find(s => s.startUtcMs > nowMs) : null);

                if (activeSlot) {
                    const freqLabel = activeSlot.freqKhz ? `${activeSlot.freqKhz} kHz ${activeSlot.mode || 'USB'}` : (activeSlot.mode || 'USB');

                    const btn = document.getElementById('e07-toggle-btn');
                    if (btn) btn.addEventListener('click', () => toggleE07Playback(activeSlot.freqKhz));
                    bindRadioTunerEvents('e07', e07State);

                    activateSettledExpand(!!animateExpand);
                    startE07Playback(activeSlot.freqKhz, false);

                    e07State.countdownTimer = setInterval(async () => {
                        if (!activeCoord || activeCoord.key !== 'coord_70.0_70.0') {
                            stopE07Countdown();
                            return;
                        }
                        if (Date.now() >= activeSlot.endUtcMs) {
                            stopE07Countdown();
                            const refreshed = await fetchE07Schedule();
                            if (activeCoord && activeCoord.key === 'coord_70.0_70.0') {
                                renderE07Result(refreshed, false);
                            }
                        }
                    }, 1000);
                    return;
                }

                const targetMs = nextSlot ? nextSlot.startUtcMs : (nowMs + 3600000);
                e07State.targetMs = targetMs;
                const hhmm = formatCountdownHHMM(targetMs - nowMs);
                const nextFreqLabel = nextSlot && nextSlot.freqKhz
                    ? `${nextSlot.freqKhz} kHz ${nextSlot.mode || 'USB'}`
                    : 'USB';
                const upcomingRows = (sched.upcoming || []).slice(0, 4).map(s => {
                    const f = s.freqKhz ? `${s.freqKhz} kHz ${s.mode || 'USB'}` : (s.mode || 'USB');
                    const rem = s.remarks ? ` ${s.remarks}` : '';
                    return `<div class="e07-schedule-row"><span>${escapeHTML(formatUtcSlot(s.startUtcMs))}</span><span class="e07-schedule-muted">${escapeHTML(f + rem)}</span></div>`;
                }).join('');

                out.innerHTML = `
                    <div class="signal-frame" id="signal-frame">
                        <div class="packet-card">
                            <div class="pip-box">
                                <div class="pip-radio-bar" id="e07-radio-bar">
                                    <span>${tr('e07Name')} // ${escapeHTML(nextFreqLabel)}</span>
                                    <div class="pip-bars" aria-hidden="true">
                                        <span class="pip-bar pip-bar-1"></span>
                                        <span class="pip-bar pip-bar-2"></span>
                                        <span class="pip-bar pip-bar-3"></span>
                                        <span class="pip-bar pip-bar-4"></span>
                                    </div>
                                </div>
                                <div class="e07-countdown-box" id="e07-countdown-text">
                                    ${tr('e07NextIn')} ${escapeHTML(hhmm)}

                                <div class="e07-schedule-meta">
                                    <div class="e07-schedule-row">
                                        <span id="e07-sched-lbl">${tr('e07SchedLabel')}</span>
                                        <span id="e07-sched-days" class="e07-schedule-muted">${tr('e07SchedDays')}</span>
                                    </div>
                                    ${upcomingRows}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                activateSettledExpand(!!animateExpand);

                e07State.countdownTimer = setInterval(async () => {
                    if (!activeCoord || activeCoord.key !== 'coord_70.0_70.0') {
                        stopE07Countdown();
                        return;
                    }
                    const diff = targetMs - Date.now();
                    const cdEl = document.getElementById('e07-countdown-text');
                    if (diff <= 0) {
                        stopE07Countdown();
                        const refreshed = await fetchE07Schedule();
                        if (activeCoord && activeCoord.key === 'coord_70.0_70.0') {
                            renderE07Result(refreshed, false);
                        }
                        return;

                    if (cdEl) {
                        cdEl.textContent = `${tr('e07NextIn')} ${formatCountdownHHMM(diff)}`;
                    }
                }, 1000);
            }

            function extractYoutubeId(url) {
                try {
                    const u = new URL(url);
                    if (u.hostname.includes('youtu.be')) {
                        return u.pathname.slice(1).split('/')[0] || null;
                    }
                    if (u.hostname.includes('youtube.com')) {
                        if (u.pathname.startsWith('/shorts/')) {
                            return u.pathname.split('/')[2] || null;
                        }
                        if (u.pathname.startsWith('/embed/')) {
                            return u.pathname.split('/')[2] || null;
                        }
                        return u.searchParams.get('v');
                    }
                } catch (e) {}
                return null;
            }

            function buildMediaElement(url) {
                const wrap = document.createElement('div');
                wrap.className = 'media-item';

                if (!isSafeUrl(url)) return wrap;

                const ytId = extractYoutubeId(url);
                if (ytId) {
                    const frameWrap = document.createElement('div');
                    frameWrap.className = 'media-iframe-wrap';
                    const iframe = document.createElement('iframe');
                    iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(ytId);
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    iframe.allowFullscreen = true;
                    frameWrap.appendChild(iframe);
                    wrap.appendChild(frameWrap);
                    return wrap;
                }

                if (/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url) || /^data:video\//i.test(url)) {
                    const vid = document.createElement('video');
                    vid.src = url;
                    vid.controls = true;
                    vid.playsInline = true;
                    vid.preload = 'metadata';
                    wrap.appendChild(vid);
                    return wrap;
                }

                if (/\.(mp3|wav|ogg|flac|m4a|aac)(\?|#|$)/i.test(url) || /^data:audio\//i.test(url)) {
                    const aud = document.createElement('audio');
                    aud.src = url;
                    aud.controls = true;
                    aud.preload = 'metadata';
                    wrap.appendChild(aud);
                    return wrap;
                }

                const img = document.createElement('img');
                img.src = url;
                img.loading = 'lazy';
                img.alt = '';
                img.onerror = function () {
                    wrap.innerHTML = '';
                    const vid = document.createElement('video');
                    vid.src = url;
                    vid.controls = true;
                    vid.playsInline = true;
                    vid.preload = 'metadata';
                    vid.onerror = function () {
                        wrap.innerHTML = '';
                        const a = document.createElement('a');
                        a.className = 'media-fallback-link';
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = url;
                        wrap.appendChild(a);
                    };
                    wrap.appendChild(vid);
                };
                wrap.appendChild(img);
                return wrap;
            }
