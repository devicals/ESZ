            function sortPackets(packets) {
                return [...(packets || [])].sort((a, b) => {
                    const ia = Number(a.index);
                    const ib = Number(b.index);
                    const na = isNaN(ia) ? 0 : ia;
                    const nb = isNaN(ib) ? 0 : ib;
                    if (na !== nb) return na - nb;
                    return String(a.created_at || '').localeCompare(String(b.created_at || ''));
                });
            }

            async function triggerCoordinateLookup() {
                if (isSearching || isCooldownActive()) {
                    if (isCooldownActive()) startCooldownMonitor(false);
                    return;
                }

                const stateBefore = readRateState();
                if (stateBefore.windowStart && Date.now() - stateBefore.windowStart < RATE_WINDOW_MS && stateBefore.count >= RATE_LIMIT_COUNT) {
                    finalizeFifthSearchCooldown();
                    return;
                }

                const bx = coordBoxes[0];
                const by = coordBoxes[1];
                const errEl = document.getElementById('coord-error');

                const normX = normalizeBoxSlots(bx);
                const normY = normalizeBoxSlots(by);

                bx.invalid = !normX;
                by.invalid = !normY;
                if (normX) bx.slots = normX.slots;
                if (normY) by.slots = normY.slots;
                renderCoordBox(bx);
                renderCoordBox(by);

                if (!normX || !normY) {
                    playTerminalErrorSound();
                    errEl.textContent = tr('errInvalid');
                    return;
                }

                ensureAudioContext();

                const reachedLimit = recordSearchHit();
                isSearching = true;

                errEl.textContent = '';
                const nx = normX.formatted;
                const ny = normY.formatted;

                const token = ++queryToken;
                const key = `coord_${nx}_${ny}`;
                activeCoord = { x: nx, y: ny, key };
                editorState = null;

                const startTime = performance.now();
                const travelMs = showAwaitingSequence(nx, ny);
                const arriveFlashMs = 420;
                const randomMs = 80 + Math.random() * 220;

                if (nx === '00.0' && ny === '00.0') {
                    const totalTarget = travelMs + arriveFlashMs + randomMs;
                    const elapsed = performance.now() - startTime;
                    const remaining = Math.max(0, totalTarget - elapsed);
                    if (remaining > 0) {
                        await new Promise(res => setTimeout(res, remaining));
                    }
                    if (token !== queryToken) {
                        isSearching = false;
                        return;
                    }
                    isSearching = false;
                    currentPackets = [];
                    renderPipResult();
                    if (reachedLimit) {
                        finalizeFifthSearchCooldown();
                    }
                    return;
                }

                if (nx === '00.0' && ny === '70.0') {
                    const totalTarget = travelMs + arriveFlashMs + randomMs;
                    const elapsed = performance.now() - startTime;
                    const remaining = Math.max(0, totalTarget - elapsed);
                    if (remaining > 0) {
                        await new Promise(res => setTimeout(res, remaining));
                    }
                    if (token !== queryToken) {
                        isSearching = false;
                        return;
                    }
                    isSearching = false;
                    currentPackets = [];
                    renderBuzzerResult();
                    if (reachedLimit) {
                        finalizeFifthSearchCooldown();
                    }
                    return;
                }

                if (nx === '70.0' && ny === '70.0') {
                    const schedPromise = fetchE07Schedule();
                    const totalTarget = travelMs + arriveFlashMs + randomMs;
                    const [sched] = await Promise.all([
                        schedPromise,
                        new Promise(res => {
                            const elapsed = performance.now() - startTime;
                            const rem = Math.max(0, totalTarget - elapsed);
                            setTimeout(res, rem);
                        })
                    ]);
                    if (token !== queryToken) {
                        isSearching = false;
                        return;
                    }
                    isSearching = false;
                    currentPackets = [];
                    renderE07Result(sched, true);
                    if (reachedLimit) {
                        finalizeFifthSearchCooldown();
                    }
                    return;
                }

                let result;
                try {
                    const { data, error } = await sb
                        .from('site_content')
                        .select('data')
                        .eq('key', key)
                        .maybeSingle();

                    if (error) {
                        result = { error, packets: [] };
                    } else {
                        const arr = Array.isArray(data && data.data) ? data.data : [];
                        result = { error: null, packets: sortPackets(arr) };
                    }
                } catch (e) {
                    result = { error: e, packets: [] };
                }

                if (token !== queryToken) {
                    isSearching = false;
                    return;
                }

                const perItemDelay = result.packets.length * 120;
                const totalTarget = travelMs + arriveFlashMs + randomMs + perItemDelay;
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, totalTarget - elapsed);

                if (remaining > 0) {
                    await new Promise(res => setTimeout(res, remaining));
                }

                if (token !== queryToken) {
                    isSearching = false;
                    return;
                }

                isSearching = false;

                if (result.error) {
                    currentPackets = [];
                    renderSignalResults(true);
                } else {
                    currentPackets = result.packets;
                    renderSignalResults(true);
                }

                if (reachedLimit) {
                    finalizeFifthSearchCooldown();
                }
            }

            async function persistCurrentPackets() {
                if (!isOwner || !activeCoord || isSpecialCoordKey(activeCoord.key)) return false;
                const sorted = sortPackets(currentPackets);
                const key = activeCoord.key;

                try {
                    if (sorted.length === 0) {
                        const { error } = await sb.from('site_content').delete().eq('key', key);
                        if (error) throw error;
                    } else {
                        const { data: existing, error: selErr } = await sb
                            .from('site_content')
                            .select('key')
                            .eq('key', key)
                            .maybeSingle();

                        if (selErr) throw selErr;

                        if (existing) {
                            const { data: updData, error } = await sb
                                .from('site_content')
                                .update({ data: sorted })
                                .eq('key', key)
                                .select();
                            if (error) throw error;
                            if (!updData || updData.length === 0) {
                                throw new Error('Permission denied.');
                            }
                        } else {
                            const { data: insData, error } = await sb
                                .from('site_content')
                                .insert({ key, data: sorted })
                                .select();
                            if (error) throw error;
                            if (!insData || insData.length === 0) {
                                throw new Error('Permission denied.');
                            }
                        }
                    }
                    currentPackets = sorted;
                    return true;
                } catch (e) {
                    document.getElementById('coord-error').textContent = e.message || 'Error';
                    playTerminalErrorSound();
                    return false;
                }
            }

            function renderSignalResults(animateExpand) {
                if (!activeCoord) return;
                stopMorsePlayback();
                stopPipPlayback();
                stopBuzzerPlayback();
                stopE07Playback(false);

                const out = document.getElementById('signal-output');
                out.classList.add('is-visible');

                const packets = sortPackets(currentPackets);
                currentPackets = packets;

                let html = '';
                if (isOwner) {
                    html += `
                        <div class="owner-bar">
                            <button type="button" class="term-btn term-btn-sm" id="btn-add-packet">+ Add Data</button>
                        </div>
                    `;
                }

                html += `<div class="signal-frame" id="signal-frame">`;

                if (isOwner && editorState) {
                    html += buildOwnerEditorHTML();
                }

                if (packets.length === 0) {
                    html += `<div class="empty-signal">${tr('noSignal')}</div>`;
                    html += `</div>`;
                    out.innerHTML = html;
                } else {
                    html += `<div class="packets-list" id="packets-list"></div></div>`;
                    out.innerHTML = html;

                    const listEl = document.getElementById('packets-list');
                    packets.forEach((p, pos) => {
                        const card = document.createElement('div');
                        card.className = 'packet-card';

                        if (isOwner) {
                            const tools = document.createElement('div');
                            tools.className = 'packet-owner-bar';

                            const idxWrap = document.createElement('span');
                            idxWrap.className = 'idx-inline-wrap';
                            idxWrap.innerHTML = `<span>IDX:</span>`;
                            const idxInput = document.createElement('input');
                            idxInput.type = 'number';
                            idxInput.step = 'any';
                            idxInput.className = 'idx-input';
                            idxInput.value = p.index !== undefined && p.index !== null ? p.index : (pos + 1);
                            idxInput.addEventListener('change', () => updatePacketIndex(p.id, idxInput.value));
                            idxWrap.appendChild(idxInput);
                            tools.appendChild(idxWrap);

                            const editBtn = document.createElement('button');
                            editBtn.type = 'button';
                            editBtn.className = 'term-btn term-btn-sm';
                            editBtn.textContent = 'Edit';
                            editBtn.onclick = () => { playSovietRelayClunk(); openEditor('edit', p.id); };
                            tools.appendChild(editBtn);

                            const delBtn = document.createElement('button');
                            delBtn.type = 'button';
                            delBtn.className = 'term-btn term-btn-sm term-btn-danger';
                            delBtn.textContent = 'Del';
                            delBtn.onclick = () => { playSovietRelayClunk(); deletePacket(p.id); };
                            tools.appendChild(delBtn);

                            card.appendChild(tools);
                        }

                        if (p.type === 'morse') {
                            const morseBox = document.createElement('div');
                            morseBox.className = 'morse-box';

                            const codeDiv = document.createElement('div');
                            codeDiv.className = 'morse-code-display';
                            codeDiv.textContent = p.content || '';
                            morseBox.appendChild(codeDiv);

                            const controls = document.createElement('div');
                            controls.className = 'morse-controls';

                            const playBtn = document.createElement('button');
                            playBtn.type = 'button';
                            playBtn.id = 'morse-btn-' + p.id;
                            playBtn.className = 'term-btn morse-play-btn';
                            playBtn.textContent = tr('morsePlay');
                            playBtn.onclick = () => toggleMorsePlayback(p.id);
                            controls.appendChild(playBtn);

                            const carrier = document.createElement('span');
                            carrier.id = 'morse-carrier-' + p.id;
                            carrier.className = 'morse-carrier';
                            carrier.textContent = tr('standby');
                            controls.appendChild(carrier);

                            morseBox.appendChild(controls);
                            card.appendChild(morseBox);
                        } else if (p.type === 'media') {
                            const stack = document.createElement('div');
                            stack.className = 'media-stack';
                            const urls = (p.content || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
                            urls.forEach(u => stack.appendChild(buildMediaElement(u)));
                            card.appendChild(stack);
                        } else {
                            const textDiv = document.createElement('div');
                            textDiv.className = 'packet-text';
                            textDiv.textContent = p.content || '';
                            card.appendChild(textDiv);
                        }

                        listEl.appendChild(card);
                    });
                }

                if (isOwner) {
                    const addBtn = document.getElementById('btn-add-packet');
                    if (addBtn) addBtn.onclick = () => { playSovietRelayClunk(); openEditor('add', null); };
                    bindOwnerEditorEvents();
                }

                activateSettledExpand(!!animateExpand);
            }

            function getNextIndex() {
                if (!currentPackets.length) return 1;
                const max = currentPackets.reduce((m, p) => {
                    const v = Number(p.index);
                    return !isNaN(v) && v > m ? v : m;
                }, 0);
                return Math.floor(max) + 1;
            }

            function openEditor(mode, packetId) {
                if (!isOwner) return;
                editorState = { mode, id: packetId || null };
                renderSignalResults(false);
            }

            function closeEditor() {
                playSovietRelayClunk();
                editorState = null;
                renderSignalResults(false);
            }

            function buildOwnerEditorHTML() {
                const isEdit = editorState.mode === 'edit';
                const existing = isEdit ? currentPackets.find(p => p.id === editorState.id) : null;
                const typeVal = existing ? existing.type : 'text';
                const idxVal = existing && existing.index !== undefined ? existing.index : getNextIndex();
                const contentVal = existing ? (existing.content || '') : '';

                return `
                    <div class="owner-editor" id="owner-editor">
                        <div class="owner-editor-title">
                            <span>${isEdit ? 'Edit' : 'Add'}</span>
                            <button type="button" class="term-btn term-btn-sm" id="ed-close-btn">Cancel</button>
                        </div>

                        <div style="display:flex; gap:12px; flex-wrap:wrap;">
                            <div class="editor-field" style="flex:1; min-width:180px;">
                                <label>Type</label>
                                <select id="ed-type" class="editor-select">
                                    <option value="text" ${typeVal === 'text' ? 'selected' : ''}>Text</option>
                                    <option value="morse" ${typeVal === 'morse' ? 'selected' : ''}>Morse Code</option>
                                    <option value="media" ${typeVal === 'media' ? 'selected' : ''}>Media</option>
                                </select>
                            </div>

                            <div class="editor-field" style="width:130px;">
                                <label>Index</label>
                                <input type="number" step="any" id="ed-index" class="editor-input" value="${escapeHTML(String(idxVal))}">
                            </div>
                        </div>

                        <div class="editor-field">
                            <label>Content</label>
                            <textarea id="ed-content" class="editor-textarea" rows="6">${escapeHTML(contentVal)}</textarea>
                        </div>

                        <div id="ed-media-attach-wrap" style="display:none; margin-bottom:12px;">
                            <input type="file" id="ed-file-input" accept="image/*,video/*,audio/*" style="display:none;">
                            <button type="button" class="term-btn term-btn-sm" id="ed-attach-btn">+ Attach File</button>
                        </div>

                        <div class="editor-actions">
                            <button type="button" class="term-btn" id="ed-save-btn">Save</button>
                        </div>
                    </div>
                `;
            }

            function bindOwnerEditorEvents() {
                const ed = document.getElementById('owner-editor');
                if (!ed) return;

                const typeSel = document.getElementById('ed-type');
                const contentEl = document.getElementById('ed-content');
                const attachWrap = document.getElementById('ed-media-attach-wrap');
                const fileInput = document.getElementById('ed-file-input');

                function updateAttachVisibility() {
                    attachWrap.style.display = typeSel.value === 'media' ? 'block' : 'none';
                }

                typeSel.addEventListener('change', () => {
                    playSovietRelayClunk();
                    updateAttachVisibility();
                });
                updateAttachVisibility();

                document.getElementById('ed-close-btn').onclick = closeEditor;
                document.getElementById('ed-attach-btn').onclick = () => {
                    playSovietRelayClunk();
                    fileInput.click();
                };
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const existing = contentEl.value.trim();
                        contentEl.value = existing ? existing + '\n' + ev.target.result : ev.target.result;
                    };
                    reader.readAsDataURL(file);
                    fileInput.value = '';
                };

                document.getElementById('ed-save-btn').onclick = async () => {
                    if (!isOwner || !activeCoord) return;
                    playSovietRelayClunk();
                    const type = typeSel.value;
                    const rawIdx = parseFloat(document.getElementById('ed-index').value);
                    const index = isNaN(rawIdx) ? getNextIndex() : rawIdx;
                    const content = contentEl.value;

                    if (!content.trim()) return;

                    document.getElementById('coord-error').textContent = '';

                    if (editorState.mode === 'edit' && editorState.id) {
                        const target = currentPackets.find(p => p.id === editorState.id);
                        if (target) {
                            target.type = type;
                            target.index = index;
                            target.content = content;
                        }
                    } else {
                        currentPackets.push({
                            id: 'sig_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                            type,
                            index,
                            content,
                            created_at: new Date().toISOString()
                        });
                    }

                    const ok = await persistCurrentPackets();
                    if (ok) {
                        editorState = null;
                        renderSignalResults(false);
                    }
                };
            }

            async function updatePacketIndex(packetId, newVal) {
                if (!isOwner || !activeCoord) return;
                const parsed = parseFloat(newVal);
                if (isNaN(parsed)) return;
                const target = currentPackets.find(p => p.id === packetId);
                if (!target) return;
                target.index = parsed;
                const ok = await persistCurrentPackets();
                if (ok) renderSignalResults(false);
            }

            async function deletePacket(packetId) {
                if (!isOwner || !activeCoord) return;
                currentPackets = currentPackets.filter(p => p.id !== packetId);
                if (editorState && editorState.id === packetId) editorState = null;
                const ok = await persistCurrentPackets();
                if (ok) renderSignalResults(false);
            }

            document.addEventListener('DOMContentLoaded', () => {
                buildeszBarrelMap();
                initBarrelPointerMap();

                const bx = initCoordBox('coord-box-x', 'coord-x', true);
                const by = initCoordBox('coord-box-y', 'coord-y', false);
                coordBoxes = [bx, by];

                bindCoordBoxEvents(bx, by);
                bindCoordBoxEvents(by, bx);

                document.getElementById('retrieve-btn').addEventListener('click', () => {
                    playSovietRelayClunk();
                    triggerCoordinateLookup();
                });
                document.getElementById('cooldown-skip-btn').addEventListener('click', () => {
                    playSovietRelayClunk();
                    skipCooldownByOwner();
                });
                document.getElementById('nsa-lang-ru').addEventListener('click', () => setLanguage('ru'));
                document.getElementById('nsa-lang-en').addEventListener('click', () => setLanguage('en'));
                document.getElementById('esz-scroll').addEventListener('scroll', updateExpandLines, { passive: true });

                applyLanguageUI();
                verifyAuthWithDatabase();
                scheduleWindowReset();
                startCooldownMonitor(false);
                if (!isCooldownActive()) {
                    focusCoordBox(bx, 0);
                }
            });
        })();
    </script>
</body>
</html>
