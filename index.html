<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный Селектор Записей</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <style>
        @font-face {
            font-family: 'OCR A Becker RUS-LAT';
            src: url('assets/fonts/OCR%20A%20Becker%20RUS-LAT.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #000000;
            --fg: #33ff66;
            --bright: #7dff9e;
            --muted: #1b8a38;
            --dim: #0c3b18;
            --border: #1e9e40;
            --err: #ff4d4d;
            --glow: rgba(51, 255, 102, 0.24);
            --bezel-border: rgba(51, 255, 102, 0.18);
            --bezel-glow: rgba(51, 255, 102, 0.12);
            --line-stroke: rgba(51, 255, 102, 0.34);
            --axis-line: rgba(51, 255, 102, 0.42);
            --axis-glow: rgba(51, 255, 102, 0.35);
            --settled-border: rgba(125, 255, 158, 0.85);
            --settled-bg: rgba(51, 255, 102, 0.08);
            --settled-glow: rgba(51, 255, 102, 0.55);
            --slot-empty: #104d20;
            --slot-active-bg: rgba(51, 255, 102, 0.12);
            --card-bg: rgba(1, 8, 3, 0.94);
            --morse-bg: #020a04;
            --editor-bg: rgba(1, 10, 4, 0.94);
            --btn-hover-bg: #041408;
            --btn-active-bg: #092610;
            --nsa-fg: #d6c5a3;
            --nsa-bright: #f2e5c9;
            --nsa-muted: #8f8268;
            --nsa-border: rgba(214, 197, 163, 0.24);
            --nsa-bg: rgba(9, 8, 6, 0.9);
            --nsa-glow: rgba(214, 197, 163, 0.18);
        }

        .esz-stage.is-cooldown {
            --fg: #d8d8d8;
            --bright: #ffffff;
            --muted: #7a7a7a;
            --dim: #3d3d3d;
            --border: #9e9e9e;
            --err: #e0e0e0;
            --glow: rgba(255, 255, 255, 0.24);
            --bezel-border: rgba(255, 255, 255, 0.24);
            --bezel-glow: rgba(255, 255, 255, 0.12);
            --line-stroke: rgba(255, 255, 255, 0.36);
            --axis-line: rgba(255, 255, 255, 0.44);
            --axis-glow: rgba(255, 255, 255, 0.35);
            --settled-border: rgba(255, 255, 255, 0.85);
            --settled-bg: rgba(255, 255, 255, 0.08);
            --settled-glow: rgba(255, 255, 255, 0.55);
            --slot-empty: #4a4a4a;
            --slot-active-bg: rgba(255, 255, 255, 0.12);
            --card-bg: rgba(12, 12, 12, 0.94);
            --morse-bg: #0d0d0d;
            --editor-bg: rgba(14, 14, 14, 0.94);
            --btn-hover-bg: #181818;
            --btn-active-bg: #262626;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0;
            font-family: 'OCR A Becker RUS-LAT', monospace;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        html, body {
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            line-height: 1.6;
            text-shadow: 0 0 6px var(--glow);
            -webkit-font-smoothing: antialiased;
        }

        .esz-svg-defs {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .esz-stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            filter: url(#esz-barrel);
        }

        .esz-bezel {
            position: fixed;
            inset: 14px;
            border: 2px solid var(--bezel-border);
            box-shadow: 0 0 6px var(--bezel-glow);
            overflow: hidden;
            background: #000000;
            z-index: 1;
        }

        .esz-stage.is-cooldown .esz-bezel {
            animation: bezelRedFlash 1.4s ease-in-out infinite;
        }

        @keyframes bezelRedFlash {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.34);
                box-shadow: 0 0 9px rgba(255, 255, 255, 0.22);
            }
            50% {
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow: 0 0 3px rgba(255, 255, 255, 0.06);
            }
        }

        .esz-cooldown-tint {
            position: fixed;
            inset: 14px;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: multiply;
            display: none;
        }

        .esz-stage.is-cooldown .esz-cooldown-tint {
            display: block;
        }

        .nsa-bar {
            position: fixed;
            left: 16px;
            right: 16px;
            z-index: 12;
            background: var(--nsa-bg);
            color: var(--nsa-fg);
            text-shadow: 0 0 4px var(--nsa-glow);
            font-size: 10.5px;
            letter-spacing: 1px;
            line-height: 1.3;
            padding: 5px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            user-select: none;
        }

        .nsa-bar-top {
            top: 16px;
            border-bottom: 1px solid var(--nsa-border);
        }

        .nsa-bar-bottom {
            bottom: 16px;
            border-top: 1px solid var(--nsa-border);
            justify-content: center;
            text-align: center;
            color: var(--nsa-muted);
            font-size: 10px;
            letter-spacing: 1.4px;
        }

        .nsa-bar-ref {
            color: var(--nsa-fg);
            white-space: nowrap;
        }

        .nsa-lang-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--nsa-muted);
            white-space: nowrap;
        }

        .nsa-lang-btn {
            background: transparent;
            border: none;
            padding: 0 2px;
            font-size: 10.5px;
            letter-spacing: 1px;
            color: var(--nsa-muted);
            text-shadow: none;
            cursor: pointer;
            outline: none;
            transition: color 0.12s ease, text-shadow 0.12s ease;
        }

        .nsa-lang-btn.is-barrel-hover {
            color: var(--nsa-bright);
            text-shadow: 0 0 5px var(--nsa-glow);
        }

        .nsa-lang-btn.is-active {
            color: var(--nsa-bright);
            text-shadow: 0 0 6px var(--nsa-glow);
        }

        .nsa-lang-sep {
            color: var(--nsa-muted);
            opacity: 0.6;
        }

        .esz-bezel-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.85),
                inset 0 0 28px var(--bezel-glow);
        }

        .esz-expand-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: none;
        }

        .esz-expand-svg.is-visible {
            display: block;
        }

        .esz-expand-svg line {
            stroke: var(--line-stroke);
            stroke-width: 1.5;
        }

        .esz-axis-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            display: none;
        }

        .esz-axis-layer.is-active {
            display: block;
        }

        .esz-axis-layer.is-locked-only .esz-axis-x,
        .esz-axis-layer.is-locked-only .esz-axis-y {
            display: none;
        }

        .esz-axis-x {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 1.5px;
            background: var(--axis-line);
            box-shadow: 0 0 6px var(--axis-glow);
            will-change: left;
        }

        .esz-axis-y {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 1.5px;
            background: var(--axis-line);
            box-shadow: 0 0 6px var(--axis-glow);
            will-change: top;
        }

        .esz-axis-target {
            position: absolute;
            left: 0;
            top: 0;
            width: 14px;
            height: 14px;
            margin-left: -6.25px;
            margin-top: -6.25px;
            border: 1.5px solid var(--bright);
            box-shadow: 0 0 8px var(--glow);
            will-change: left, top;
        }

        .esz-axis-target.is-flashing {
            animation: targetFlash 0.13s steps(1, end) infinite;
        }

        .esz-axis-target.is-settled {
            border-color: var(--settled-border);
            box-shadow: 0 0 10px var(--settled-glow);
            background: var(--settled-bg);
        }

        @keyframes targetFlash {
            0% {
                opacity: 1;
                background: var(--settled-bg);
                box-shadow: 0 0 14px var(--settled-glow);
            }
            50% {
                opacity: 0.2;
                background: transparent;
                box-shadow: none;
            }
            100% {
                opacity: 1;
                background: var(--settled-bg);
                box-shadow: 0 0 14px var(--settled-glow);
            }
        }

        .cooldown-header {
            position: absolute;
            top: 42px;
            left: 20px;
            right: 20px;
            z-index: 6;
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .esz-stage.is-cooldown .cooldown-header {
            display: flex;
        }

        .cooldown-banner {
            padding: 6px 14px;
            text-align: center;
            font-size: clamp(12px, 2vw, 17px);
            letter-spacing: 1.2px;
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
            background: rgba(0, 0, 0, 0.78);
        }

        .cooldown-banner.is-red-zone {
            animation: bannerRedFlash 1.4s ease-in-out infinite;
        }

        @keyframes bannerRedFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.54; }
        }

        .cooldown-skip-btn {
            display: none;
            margin-top: 8px;
            pointer-events: auto;
        }

        .esz-stage.is-cooldown.is-owner .cooldown-skip-btn {
            display: inline-block;
        }

        .esz-scroll {
            position: relative;
            z-index: 4;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 54px 28px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .esz-stage.is-cooldown .esz-scroll {
            padding-top: 112px;
        }

        .terminal-shell {
            margin: auto 0;
            max-width: 760px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coord-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coord-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .esz-stage.is-cooldown .coord-row {
            opacity: 0.45;
            pointer-events: none;
        }

        .esz-stage.is-cooldown .coord-error {
            visibility: hidden;
        }

        .coord-box {
            position: relative;
            width: 122px;
            height: 49px;
            background: #000000;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 3px var(--bezel-glow), inset 0 0 12px var(--slot-active-bg);
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
            cursor: text;
        }

        .coord-box.is-focused {
            border-color: var(--bright);
            box-shadow: 0 0 10px var(--glow);
        }

        .coord-box.is-invalid {
            border-color: var(--err);
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.24);
        }

        .coord-box.is-invalid .coord-slot.is-filled,
        .coord-box.is-invalid .coord-dot {
            color: var(--err);
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.35);
        }

        .coord-slots {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            pointer-events: none;
        }

        .coord-slot {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 28px;
            color: var(--slot-empty);
            text-shadow: none;
        }

        .coord-slot.is-filled {
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
        }

        .coord-dot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 28px;
            color: var(--slot-empty);
            text-shadow: none;
        }

        .coord-box.has-any .coord-dot {
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
        }

        .coord-slot.is-active {
            background: var(--slot-active-bg);
        }

        .coord-slot.is-active::after {
            content: '_';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px;
            text-align: center;
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
            animation: cmdCursorBlink 0.72s steps(1, end) infinite;
        }

        .coord-box.is-invalid .coord-slot.is-active::after {
            color: var(--err);
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.45);
        }

        @keyframes cmdCursorBlink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .coord-native-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            border: none;
            outline: none;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            font-size: 22px;
            z-index: 2;
            cursor: text;
        }

        .term-btn {
            background: #000000;
            color: var(--fg);
            border: 2px solid var(--border);
            padding: 10px 18px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 6px var(--glow);
            box-shadow: 0 0 3px var(--bezel-glow);
            transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
        }

        .term-btn.is-barrel-hover {
            border-color: var(--bright);
            color: var(--bright);
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .term-btn.is-barrel-active {
            background: var(--btn-active-bg);
        }

        .term-btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-width: 1.5px;
        }

        .term-btn-danger {
            color: var(--err);
            border-color: #7a2626;
            text-shadow: none;
            box-shadow: 0 0 3px rgba(122, 38, 38, 0.4);
        }

        .term-btn-danger.is-barrel-hover {
            border-color: var(--err);
            color: var(--err);
            background: #140505;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.24);
        }

        .esz-stage.is-cooldown .term-btn-danger {
            border-color: var(--border);
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .esz-stage.is-cooldown .term-btn-danger.is-barrel-hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .coord-submit-btn {
            height: 49px;
        }

        .coord-error {
            margin-top: 10px;
            font-size: 12px;
            color: var(--err);
            text-align: center;
            min-height: 18px;
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.25);
        }

        .signal-output {
            width: 100%;
            display: none;
            margin-top: 22px;
        }

        .signal-output.is-visible {
            display: block;
        }

        .signal-frame {
            width: 100%;
            background: #000000;
            border: 2px solid var(--border);
            padding: 16px;
            box-shadow: 0 0 8px var(--bezel-glow);
            transform-origin: center center;
        }

        .awaiting-box {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .beacon-svg {
            width: 120px;
            height: 64px;
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 4px var(--axis-glow));
        }

        .beacon-svg path {
            stroke: var(--fg);
        }

        .beacon-svg circle {
            fill: var(--bright);
        }

        .beacon-dot {
            animation: dotStep 0.72s steps(1, end) infinite;
        }

        .beacon-wave-1 {
            animation: waveStep1 0.72s steps(1, end) infinite;
        }

        .beacon-wave-2 {
            animation: waveStep2 0.72s steps(1, end) infinite;
        }

        .beacon-wave-3 {
            animation: waveStep3 0.72s steps(1, end) infinite;
        }

        @keyframes dotStep {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @keyframes waveStep1 {
            0% { opacity: 1; }
            45% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        @keyframes waveStep2 {
            0% { opacity: 0.1; }
            22% { opacity: 1; }
            68% { opacity: 0.1; }
            100% { opacity: 0.1; }
        }

        @keyframes waveStep3 {
            0% { opacity: 0.1; }
            45% { opacity: 1; }
            88% { opacity: 0.1; }
            100% { opacity: 0.1; }
        }

        .owner-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .empty-signal {
            padding: 14px;
            color: var(--fg);
            font-size: 14px;
            text-align: center;
        }

        .packets-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .packet-card {
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            padding: 16px 18px;
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .packet-owner-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1.5px solid var(--dim);
            padding-bottom: 10px;
            margin-bottom: 14px;
            font-size: 11px;
            color: var(--muted);
        }

        .idx-inline-wrap {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .idx-input {
            width: 58px;
            background: #000000;
            color: var(--bright);
            border: 1.5px solid var(--border);
            padding: 3px 6px;
            font-size: 11px;
            text-align: center;
            outline: none;
        }

        .idx-input::-webkit-outer-spin-button,
        .idx-input::-webkit-inner-spin-button,
        #ed-index::-webkit-outer-spin-button,
        #ed-index::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .idx-input,
        #ed-index {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .idx-input:focus {
            border-color: var(--bright);
        }

        .packet-text {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.75;
            color: var(--fg);
        }

        .morse-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .morse-code-display {
            font-size: 15px;
            letter-spacing: 2px;
            line-height: 1.8;
            color: var(--bright);
            word-break: break-word;
            white-space: pre-wrap;
            border: 1.5px solid var(--dim);
            padding: 12px 14px;
            background: var(--morse-bg);
        }

        .morse-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .morse-play-btn {
            min-width: 110px;
        }

        .morse-play-btn.is-playing {
            border-color: var(--err);
            color: var(--err);
            text-shadow: none;
            box-shadow: 0 0 3px rgba(255, 77, 77, 0.4);
        }

        .morse-play-btn.is-playing.is-barrel-hover {
            background: #140505;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.24);
        }

        .esz-stage.is-cooldown .morse-play-btn.is-playing {
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .esz-stage.is-cooldown .morse-play-btn.is-playing.is-barrel-hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .morse-carrier {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .morse-carrier.is-tx {
            color: var(--bright);
        }

        .pip-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pip-radio-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1.5px solid var(--dim);
            padding: 10px 14px;
            background: var(--morse-bg);
            font-size: 13px;
            color: var(--bright);
            letter-spacing: 1px;
        }

        .pip-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .pip-bar {
            width: 3px;
            background: var(--dim);
            transition: background 0.08s ease;
        }

        .pip-bar.is-lit {
            background: var(--bright);
            box-shadow: 0 0 4px var(--glow);
        }

        .pip-bar-1 { height: 4px; }
        .pip-bar-2 { height: 8px; }
        .pip-bar-3 { height: 12px; }
        .pip-bar-4 { height: 16px; }

        .pip-radio-bar.is-connecting .pip-bar {

                    const gainSlap = ctx.createGain();
                    oscSlap.type = 'square';
                    oscSlap.frequency.setValueAtTime(480, now);
                    oscSlap.frequency.exponentialRampToValueAtTime(80, now + 0.035);

                    gainSlap.gain.setValueAtTime(0.16, now);
                    gainSlap.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

                    oscSlap.connect(gainSlap);
                    gainSlap.connect(ctx.destination);

                    const oscRattle = ctx.createOscillator();
                    const gainRattle = ctx.createGain();
                    const ratTime = now + 0.038;
                    oscRattle.type = 'triangle';
                    oscRattle.frequency.setValueAtTime(260, ratTime);
                    oscRattle.frequency.exponentialRampToValueAtTime(65, ratTime + 0.05);

                    gainRattle.gain.setValueAtTime(0, now);
                    gainRattle.gain.setValueAtTime(0.12, ratTime);
                    gainRattle.gain.exponentialRampToValueAtTime(0.0001, ratTime + 0.06);

                    oscRattle.connect(gainRattle);
                    gainRattle.connect(ctx.destination);

                    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
                    const out = buf.getChannelData(0);
                    for (let i = 0; i < out.length; i++) {
                        out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.015));
                    }
                    const nSource = ctx.createBufferSource();
                    nSource.buffer = buf;
                    const nGain = ctx.createGain();
                    nGain.gain.setValueAtTime(0.08, now);
                    nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

                    nSource.connect(nGain);
                    nGain.connect(ctx.destination);

                    oscSub.start(now);
                    oscSub.stop(now + 0.18);
                    oscSlap.start(now);
                    oscSlap.stop(now + 0.045);
                    oscRattle.start(ratTime);
                    oscRattle.stop(ratTime + 0.065);
                    nSource.start(now);
                } catch (e) {}
            }

            function playLockChirp() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1420, now);
                    osc.frequency.setValueAtTime(2180, now + 0.045);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.05, now + 0.006);
                    gain.gain.setValueAtTime(0.05, now + 0.075);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch (e) {}
            }

            function playCooldownLockoutSlam() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;

                    const oscSub = ctx.createOscillator();
                    const gainSub = ctx.createGain();
                    oscSub.type = 'sawtooth';
                    oscSub.frequency.setValueAtTime(160, now);
                    oscSub.frequency.exponentialRampToValueAtTime(32, now + 0.32);
                    gainSub.gain.setValueAtTime(0.18, now);
                    gainSub.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

                    const filterSub = ctx.createBiquadFilter();
                    filterSub.type = 'lowpass';
                    filterSub.frequency.setValueAtTime(320, now);
                    filterSub.frequency.linearRampToValueAtTime(80, now + 0.35);

                    oscSub.connect(filterSub);
                    filterSub.connect(gainSub);
                    gainSub.connect(ctx.destination);

                    const oscSnap = ctx.createOscillator();
                    const gainSnap = ctx.createGain();
                    oscSnap.type = 'square';
                    oscSnap.frequency.setValueAtTime(880, now);
                    oscSnap.frequency.exponentialRampToValueAtTime(70, now + 0.045);
                    gainSnap.gain.setValueAtTime(0.12, now);
                    gainSnap.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

                    oscSnap.connect(gainSnap);
                    gainSnap.connect(ctx.destination);

                    oscSub.start(now);
                    oscSub.stop(now + 0.36);
                    oscSnap.start(now);
                    oscSnap.stop(now + 0.06);
                } catch (e) {}
            }

            function playCooldownAlarmPulse() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const filter = ctx.createBiquadFilter();

                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(380, now);
                    filter.Q.setValueAtTime(4, now);

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.linearRampToValueAtTime(145, now + 0.16);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.075, now + 0.02);
                    gain.gain.setValueAtTime(0.075, now + 0.13);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.19);
                } catch (e) {}
            }

            function playCooldownStepTick() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.015);

                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.02);
                } catch (e) {}
            }

            function playCooldownClearChime() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const freqs = [440, 660, 880];
                    freqs.forEach((freq, i) => {
                        const start = ctx.currentTime + i * 0.07;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, start);

                        gain.gain.setValueAtTime(0, start);
                        gain.gain.linearRampToValueAtTime(0.06, start + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(start);
                        osc.stop(start + 0.24);
                    });
                } catch (e) {}
            }

            function startCooldownAlarmLoop() {
                stopCooldownAlarmLoop();
                playCooldownAlarmPulse();
                cooldownAlarmInterval = setInterval(playCooldownAlarmPulse, 1400);
            }

            function stopCooldownAlarmLoop() {
                if (cooldownAlarmInterval) {
                    clearInterval(cooldownAlarmInterval);
                    cooldownAlarmInterval = null;
                }
            }

            function startServoSound(durationMs) {
                stopServoSound();
                if (durationMs <= 40) return;
                const ctx = ensureAudioContext();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    const durationSec = durationMs / 1000;

                    const osc = ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(68, now);
                    osc.frequency.linearRampToValueAtTime(84, now + durationSec * 0.5);
                    osc.frequency.linearRampToValueAtTime(62, now + durationSec);

                    const sub = ctx.createOscillator();
                    sub.type = 'sine';
                    sub.frequency.setValueAtTime(34, now);
                    sub.frequency.linearRampToValueAtTime(42, now + durationSec * 0.5);
                    sub.frequency.linearRampToValueAtTime(31, now + durationSec);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(140, now);
                    filter.frequency.linearRampToValueAtTime(190, now + durationSec * 0.5);
                    filter.frequency.linearRampToValueAtTime(130, now + durationSec);

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.045, now + 0.04);
                    gain.gain.setValueAtTime(0.045, Math.max(now + 0.04, now + durationSec - 0.05));
                    gain.gain.linearRampToValueAtTime(0.0001, now + durationSec);

                    osc.connect(filter);
                    sub.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    sub.start(now);
                    osc.stop(now + durationSec + 0.02);
                    sub.stop(now + durationSec + 0.02);

                    activeServo = { osc, sub, gain };
                } catch (e) {}
            }

            function stopServoSound() {
                if (!activeServo) return;
                const { osc, sub, gain } = activeServo;
                activeServo = null;
                if (!audioCtx) return;
                try {
                    const now = audioCtx.currentTime;
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.02);
                    if (osc) osc.stop(now + 0.025);
                    if (sub) sub.stop(now + 0.025);
                } catch (e) {}
            }

            function getRadioChain(lowCut, highCut, peakFreq, peakGainDb, outLevel) {
                const ctx = ensureAudioContext();
                if (!ctx) return null;
                if (!radioAnalyser) {
                    radioHp1 = ctx.createBiquadFilter();
                    radioHp1.type = 'highpass';
                    radioHp1.Q.value = 0.707;

                    radioHp2 = ctx.createBiquadFilter();
                    radioHp2.type = 'highpass';
                    radioHp2.Q.value = 0.707;

                    radioLp1 = ctx.createBiquadFilter();
                    radioLp1.type = 'lowpass';
                    radioLp1.Q.value = 0.707;

                    radioLp2 = ctx.createBiquadFilter();
                    radioLp2.type = 'lowpass';
                    radioLp2.Q.value = 0.707;

                    radioPeak = ctx.createBiquadFilter();
                    radioPeak.type = 'peaking';
                    radioPeak.Q.value = 2.0;

                    radioOutGain = ctx.createGain();
                    radioOutGain.gain.value = 1.05;

                    radioAnalyser = ctx.createAnalyser();
                    radioAnalyser.fftSize = 1024;
                    radioAnalyser.smoothingTimeConstant = 0.78;

                    radioHp1.connect(radioHp2);
                    radioHp2.connect(radioLp1);
                    radioLp1.connect(radioLp2);
                    radioLp2.connect(radioPeak);
                    radioPeak.connect(radioOutGain);
                    radioOutGain.connect(radioAnalyser);
                    radioAnalyser.connect(ctx.destination);

                    radioInputNode = radioHp1;
                    waveData = new Uint8Array(radioAnalyser.fftSize);
                }
                const now = ctx.currentTime;
                const hpFreq = Math.max(80, lowCut || 200);
                const lpFreq = Math.min(5500, highCut || 2000);
                if (radioHp1) radioHp1.frequency.setValueAtTime(hpFreq, now);
                if (radioHp2) radioHp2.frequency.setValueAtTime(hpFreq, now);
                if (radioLp1) radioLp1.frequency.setValueAtTime(lpFreq, now);
                if (radioLp2) radioLp2.frequency.setValueAtTime(lpFreq, now);
                if (radioPeak) {
                    radioPeak.frequency.setValueAtTime(peakFreq || 640, now);
                    radioPeak.gain.setValueAtTime(peakGainDb || 0, now);
                }
                if (radioOutGain) {
                    radioOutGain.gain.setValueAtTime(typeof outLevel === 'number' ? outLevel : 1.05, now);
                }
                return radioInputNode;
            }

            function stopWaveLoop() {
                if (waveRaf !== null) {
                    cancelAnimationFrame(waveRaf);
                    waveRaf = null;
                }
            }

            function updateSignalMeter(isLive) {
                const bars = [
                    document.querySelector('.pip-bar-1'),
                    document.querySelector('.pip-bar-2'),
                    document.querySelector('.pip-bar-3'),
                    document.querySelector('.pip-bar-4')
                ];
                if (!bars[0]) return;

                if (!isLive) {
                    bars.forEach(b => { if (b) b.classList.remove('is-lit'); });
                    return;
                }

                let rms = 0;
                if (radioAnalyser && waveData) {
                    let sum = 0;
                    for (let i = 0; i < waveData.length; i++) {
                        const val = (waveData[i] - 128) / 128;
                        sum += val * val;
                    }
                    rms = Math.sqrt(sum / waveData.length);
                }

                let activeCount = 1;
                if (rms > 0.02) activeCount = 2;
                if (rms > 0.05) activeCount = 3;
                if (rms > 0.09) activeCount = 4;

                bars.forEach((b, idx) => {
                    if (b) b.classList.toggle('is-lit', idx < activeCount);
                });
            }

            function drawWaveOnce(isLive, isConnecting) {
                const canvas = document.getElementById('radio-wave-canvas');
                if (!canvas) return;
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                const w = Math.max(1, canvas.clientWidth);
                const h = Math.max(1, canvas.clientHeight);
                if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                }

                const ctx2d = canvas.getContext('2d');
                if (!ctx2d) return;
                ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx2d.clearRect(0, 0, w, h);

                const stageEl = document.getElementById('esz-stage') || document.documentElement;
                const cs = getComputedStyle(stageEl);
                const dimColor = cs.getPropertyValue('--dim').trim() || '#0c3b18';
                const brightColor = cs.getPropertyValue('--bright').trim() || '#7dff9e';
                const midY = h * 0.5;

                ctx2d.save();
                ctx2d.strokeStyle = dimColor;
                ctx2d.lineWidth = 1;
                ctx2d.beginPath();
                ctx2d.moveTo(0, midY);
                ctx2d.lineTo(w, midY);
                ctx2d.stroke();
                ctx2d.restore();

                if (isLive && radioAnalyser && waveData) {
                    radioAnalyser.getByteTimeDomainData(waveData);
                    ctx2d.save();
                    ctx2d.strokeStyle = brightColor;
                    ctx2d.lineWidth = 1.6;
                    ctx2d.shadowColor = brightColor;
                    ctx2d.shadowBlur = 6;
                    ctx2d.beginPath();
                    const sliceW = w / (waveData.length - 1);
                    for (let i = 0; i < waveData.length; i++) {
                        const v = (waveData[i] - 128) / 128;
                        const y = Math.max(4, Math.min(h - 4, midY + v * (h * 0.44) * 2.1));
                        const x = i * sliceW;
                        if (i === 0) ctx2d.moveTo(x, y);
                        else ctx2d.lineTo(x, y);
                    }
                    ctx2d.stroke();
                    ctx2d.restore();
                } else if (isConnecting) {
                    ctx2d.save();
                    ctx2d.strokeStyle = cs.getPropertyValue('--muted').trim() || '#1b8a38';
                    ctx2d.lineWidth = 1.2;
                    ctx2d.setLineDash([6, 6]);
                    ctx2d.lineDashOffset = -(performance.now() * 0.04) % 12;
                    ctx2d.beginPath();
                    ctx2d.moveTo(0, midY);
                    ctx2d.lineTo(w, midY);
                    ctx2d.stroke();
                    ctx2d.restore();
                }
                updateSignalMeter(isLive);
            }

            function startWaveLoop(getStatusFn) {
                stopWaveLoop();
                function frame() {
                    const canvas = document.getElementById('radio-wave-canvas');
                    if (!canvas) {
                        waveRaf = null;
                        return;
                    }
                    const st = getStatusFn();
                    drawWaveOnce(st.playing && st.phase === 'live', st.playing && st.phase === 'connecting');
                    if (st.playing) {
                        waveRaf = requestAnimationFrame(frame);
                    } else {
                        waveRaf = null;
                    }
                }
                waveRaf = requestAnimationFrame(frame);
            }

            function readRateState() {
                try {
                    const raw = localStorage.getItem(RATE_KEY);
                    if (!raw) return { windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 };
                    const parsed = JSON.parse(raw);
                    return {
                        windowStart: Number(parsed.windowStart) || 0,
                        count: Number(parsed.count) || 0,
                        cooldownStart: Number(parsed.cooldownStart) || 0,
                        cooldownUntil: Number(parsed.cooldownUntil) || 0
                    };
                } catch (e) {
                    return { windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 };
                }
            }

            function writeRateState(state) {
                try {
                    localStorage.setItem(RATE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            function clearRateState() {
                writeRateState({ windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 });
            }

            function isCooldownActive() {
                const state = readRateState();
                return state.cooldownUntil > Date.now();
            }

            function setSearchInputsDisabled(disabled) {
                const xIn = document.getElementById('coord-x');
                const yIn = document.getElementById('coord-y');
                const btn = document.getElementById('retrieve-btn');
                if (xIn) xIn.disabled = disabled;
                if (yIn) yIn.disabled = disabled;
                if (btn) btn.disabled = disabled;
                if (disabled && coordBoxes.length) {
                    coordBoxes.forEach(b => {
                        if (b.focused) {
                            b.focused = false;
                            b.inputEl.blur();
                            renderCoordBox(b);
                        }
                    });
                }
            }

            function stopCooldownTimers() {
                stopCooldownAlarmLoop();
                setMainsHumLevel(0.007, 0.4);
                if (cooldownTimer) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                }
                if (enterAnimTimer) {
                    clearInterval(enterAnimTimer);
                    enterAnimTimer = null;
                }
                isEnteringCooldown = false;
                lastCooldownStepIdx = -1;
            }

            function scheduleWindowReset() {
                if (windowResetTimer) {
                    clearTimeout(windowResetTimer);
                    windowResetTimer = null;
                }
                const state = readRateState();
                if (state.cooldownUntil > Date.now()) return;
                if (state.windowStart > 0 && state.count > 0) {
                    const rem = (state.windowStart + RATE_WINDOW_MS) - Date.now();
                    if (rem <= 0) {
                        clearRateState();
                    } else {
                        windowResetTimer = setTimeout(() => {
                            windowResetTimer = null;
                            const cur = readRateState();
                            if (!cur.cooldownUntil && cur.windowStart > 0 && Date.now() - cur.windowStart >= RATE_WINDOW_MS) {
                                clearRateState();
                            }
                        }, rem + 25);
                    }
                }
            }

            function updateBannerFlashZone(greenPct) {
                const bezel = document.getElementById('esz-bezel');
                const banner = document.getElementById('cooldown-banner');
                if (!bezel || !banner) return;
                const br = bezel.getBoundingClientRect();
                const tr = banner.getBoundingClientRect();
                if (br.height <= 0) return;
                const centerPct = ((tr.top + tr.height * 0.5 - br.top) / br.height) * 100;
                banner.classList.toggle('is-red-zone', greenPct <= centerPct);
            }

            function applyCooldownStep() {
                if (isEnteringCooldown) return;
                const stage = document.getElementById('esz-stage');
                const tint = document.getElementById('esz-cooldown-tint');
                const banner = document.getElementById('cooldown-banner');
                if (!stage || !tint) return;

                const state = readRateState();
                const now = Date.now();

                if (!state.cooldownUntil || now >= state.cooldownUntil) {
                    const hadCooldown = stage.classList.contains('is-cooldown');
                    stopCooldownTimers();
                    if (state.cooldownUntil > 0 || (state.windowStart > 0 && now - state.windowStart >= RATE_WINDOW_MS)) {
                        clearRateState();
                    }
                    stage.classList.remove('is-cooldown');
                    if (banner) banner.classList.remove('is-red-zone');
                    tint.style.background = '';
                    setSearchInputsDisabled(false);
                    scheduleWindowReset();
                    if (hadCooldown) playCooldownClearChime();
                    return;
                }

                const total = Math.max(1, state.cooldownUntil - state.cooldownStart);
                const elapsed = Math.max(0, now - state.cooldownStart);
                const ratio = Math.min(0.9999, elapsed / total);
                const stepIdx = Math.min(COOLDOWN_STEPS - 1, Math.floor(ratio * COOLDOWN_STEPS));
                const greenPct = (stepIdx / COOLDOWN_STEPS) * 100;

                if (lastCooldownStepIdx !== -1 && stepIdx !== lastCooldownStepIdx) {
                    playCooldownStepTick();
                }
                lastCooldownStepIdx = stepIdx;

                stage.classList.add('is-cooldown');
                setSearchInputsDisabled(true);
                tint.style.background = `linear-gradient(to bottom, #33ff66 0%, #33ff66 ${greenPct}%, #ff3838 ${greenPct}%, #ff3838 100%)`;
                updateBannerFlashZone(greenPct);
            }

            function startCooldownMonitor(withEnterSweep) {
                stopCooldownTimers();

                if (!isCooldownActive()) {
                    applyCooldownStep();
                    return;
                }

                const stage = document.getElementById('esz-stage');
                const tint = document.getElementById('esz-cooldown-tint');
                const banner = document.getElementById('cooldown-banner');

                if (withEnterSweep && stage && tint) {
                    isEnteringCooldown = true;
                    stage.classList.add('is-cooldown');
                    setSearchInputsDisabled(true);
                    if (banner) banner.classList.add('is-red-zone');
                    let step = 0;
                    tint.style.background = 'linear-gradient(to bottom, #ff3838 0%, #ff3838 0%, #33ff66 0%, #33ff66 100%)';
                    setMainsHumLevel(0.045, 0.25);
                    playCooldownLockoutSlam();

                    enterAnimTimer = setInterval(() => {
                        step++;
                        const redPct = (step / COOLDOWN_STEPS) * 100;
                        tint.style.background = `linear-gradient(to bottom, #ff3838 0%, #ff3838 ${redPct}%, #33ff66 ${redPct}%, #33ff66 100%)`;
                        if (step >= COOLDOWN_STEPS) {
                            clearInterval(enterAnimTimer);
                            enterAnimTimer = null;
                            isEnteringCooldown = false;
                            applyCooldownStep();
                            startCooldownAlarmLoop();
                            cooldownTimer = setInterval(applyCooldownStep, 250);
                        }
                    }, 22);
                } else {
                    setMainsHumLevel(0.045, 0.4);
                    applyCooldownStep();
                    startCooldownAlarmLoop();
                    cooldownTimer = setInterval(applyCooldownStep, 250);
                }
            }

            function recordSearchHit() {
                const now = Date.now();
                let state = readRateState();

                if (!state.windowStart || now - state.windowStart >= RATE_WINDOW_MS) {
                    state = { windowStart: now, count: 1, cooldownStart: 0, cooldownUntil: 0 };
                } else {
                    state.count += 1;
                }

                writeRateState(state);
                scheduleWindowReset();
                return state.count >= RATE_LIMIT_COUNT;
            }

            function finalizeFifthSearchCooldown() {
                const now = Date.now();
                const state = readRateState();
                if (!state.windowStart || state.count < RATE_LIMIT_COUNT) return;

                const elapsed = now - state.windowStart;
                const remaining = RATE_WINDOW_MS - elapsed;

                if (remaining <= 0) {
                    clearRateState();
                    return;
                }

                writeRateState({
                    windowStart: state.windowStart,
                    count: state.count,
                    cooldownStart: now,
                    cooldownUntil: now + remaining
                });

                startCooldownMonitor(true);
            }

            function skipCooldownByOwner() {
                if (!isOwner) return;
                const stage = document.getElementById('esz-stage');
                const hadCooldown = stage && stage.classList.contains('is-cooldown');
                stopCooldownTimers();
                if (windowResetTimer) {
                    clearTimeout(windowResetTimer);
                    windowResetTimer = null;
                }
                clearRateState();
                const tint = document.getElementById('esz-cooldown-tint');
                const banner = document.getElementById('cooldown-banner');
                if (stage) stage.classList.remove('is-cooldown');
                if (banner) banner.classList.remove('is-red-zone');
                if (tint) tint.style.background = '';
                setSearchInputsDisabled(false);
                if (hadCooldown) playCooldownClearChime();
                if (coordBoxes[0]) focusCoordBox(coordBoxes[0], 0);
            }

            function buildeszBarrelMap() {
                const w = Math.max(320, window.innerWidth);
                const h = Math.max(240, window.innerHeight);

                const mapW = Math.min(1024, w);
                const mapH = Math.min(1024, h);
                const canvas = document.createElement('canvas');
                canvas.width = mapW;
                canvas.height = mapH;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(mapW, mapH);
                const data = imgData.data;

                const centerStretch = 0.05;
                const curve = 0.15;
                const eps = 0.16;
                const baseSqrt = Math.sqrt(eps);

                let maxShift = 24;
                for (let py = 0; py < mapH; py++) {
                    const ny = ((py + 0.5) / mapH) * 2 - 1;
                    for (let px = 0; px < mapW; px++) {
                        const nx = ((px + 0.5) / mapW) * 2 - 1;
                        const r2 = nx * nx + ny * ny;
                        const s = Math.sqrt(r2 + eps) - baseSqrt;
                        const factor = -centerStretch + curve * s;
                        const sx = Math.abs((w * 0.5) * nx * factor);
                        const sy = Math.abs((h * 0.5) * ny * factor);
                        if (sx > maxShift) maxShift = sx;
                        if (sy > maxShift) maxShift = sy;
                    }
                }

                for (let py = 0; py < mapH; py++) {
                    const ny = ((py + 0.5) / mapH) * 2 - 1;
                    for (let px = 0; px < mapW; px++) {
                        const nx = ((px + 0.5) / mapW) * 2 - 1;
                        const r2 = nx * nx + ny * ny;
                        const s = Math.sqrt(r2 + eps) - baseSqrt;
                        const factor = -centerStretch + curve * s;

                        const shiftX = (w * 0.5) * nx * factor;
                        const shiftY = (h * 0.5) * ny * factor;

                        const u = Math.max(-1, Math.min(1, shiftX / maxShift));
                        const v = Math.max(-1, Math.min(1, shiftY / maxShift));

                        const idx = (py * mapW + px) * 4;
                        data[idx] = Math.round(128 + 127 * u);
                        data[idx + 1] = Math.round(128 + 127 * v);
                        data[idx + 2] = 128;
                        data[idx + 3] = 255;
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');

                const filterEl = document.getElementById('esz-barrel');
                const feImg = document.getElementById('esz-disp-img');
                const feMap = document.getElementById('esz-disp-map');

                if (filterEl && feImg && feMap) {
                    filterEl.setAttribute('x', '0');
                    filterEl.setAttribute('y', '0');
                    filterEl.setAttribute('width', String(w));
                    filterEl.setAttribute('height', String(h));

                    feImg.setAttribute('x', '0');
                    feImg.setAttribute('y', '0');
                    feImg.setAttribute('width', String(w));
                    feImg.setAttribute('height', String(h));
                    feImg.setAttribute('href', dataUrl);
                    feImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', dataUrl);

                    feMap.setAttribute('scale', String(Math.round(maxShift * 2)));
                }
            }

            function mapBarrelPoint(clientX, clientY) {
                const w = Math.max(320, window.innerWidth);
                const h = Math.max(240, window.innerHeight);
                const nx = (clientX / w) * 2 - 1;
                const ny = (clientY / h) * 2 - 1;
                const r2 = nx * nx + ny * ny;
                const s = Math.sqrt(r2 + 0.16) - 0.4;
                const factor = -0.05 + 0.15 * s;
                const shiftX = (w * 0.5) * nx * factor;
                const shiftY = (h * 0.5) * ny * factor;
                return {
                    x: Math.max(0, Math.min(w - 1, clientX + shiftX)),
                    y: Math.max(0, Math.min(h - 1, clientY + shiftY))
                };
            }

            function updateBarrelSlider(slider, domX) {
                const rect = slider.getBoundingClientRect();
                if (rect.width <= 0) return;
                const min = parseFloat(slider.min);
                const max = parseFloat(slider.max);
                const step = parseFloat(slider.step) || 1;
                const lo = isNaN(min) ? 0 : min;
                const hi = isNaN(max) ? 100 : max;
                const pct = Math.max(0, Math.min(1, (domX - rect.left) / rect.width));
                const raw = lo + pct * (hi - lo);
                const snapped = Math.max(lo, Math.min(hi, Math.round((raw - lo) / step) * step + lo));
                const nextStr = String(Number(snapped.toFixed(6)));
                if (slider.value !== nextStr) {
                    slider.value = nextStr;
                    slider.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            function initBarrelPointerMap() {
                let activeSlider = null;
                let pendingBtn = null;
                let hoverEl = null;
                let suppressNative = false;
                let suppressResetTimer = null;

                const clearSuppressSoon = () => {
                    if (suppressResetTimer) clearTimeout(suppressResetTimer);
                    suppressResetTimer = setTimeout(() => {
                        suppressResetTimer = null;
                        suppressNative = false;
                    }, 0);
                };

                const setHover = (nextEl) => {
                    if (hoverEl === nextEl) return;
                    if (hoverEl) hoverEl.classList.remove('is-barrel-hover');
                    hoverEl = nextEl;
                    if (hoverEl) hoverEl.classList.add('is-barrel-hover');
                };

                const clearPendingBtn = () => {
                    if (pendingBtn) {
                        pendingBtn.classList.remove('is-barrel-active');
                        pendingBtn = null;
                    }
                };

                window.addEventListener('pointermove', (e) => {
                    if (!e.isTrusted) return;
                    const pt = mapBarrelPoint(e.clientX, e.clientY);

                    if (activeSlider) {
                        e.preventDefault();
                        e.stopPropagation();
                        updateBarrelSlider(activeSlider, pt.x);
                        return;
                    }

                    const hit = document.elementFromPoint(pt.x, pt.y);
                    const interactive = hit ? hit.closest('button, a, .term-btn, .nsa-lang-btn, .radio-slider, .coord-box, input, select, textarea') : null;
                    const hoverTarget = hit ? hit.closest('.term-btn, .nsa-lang-btn, .media-fallback-link') : null;
                    setHover(hoverTarget);

                    if (!interactive) {
                        document.body.style.cursor = '';
                    } else if (interactive.matches('.coord-box, textarea, input[type="text"], input[type="number"]')) {
                        document.body.style.cursor = 'text';
                    } else {
                        document.body.style.cursor = 'pointer';
                    }
                }, true);

                window.addEventListener('pointerleave', () => {
                    setHover(null);
                    document.body.style.cursor = '';
                });

                window.addEventListener('pointerdown', (e) => {
                    if (!e.isTrusted || e.button !== 0) return;
                    const pt = mapBarrelPoint(e.clientX, e.clientY);
                    const hit = document.elementFromPoint(pt.x, pt.y);
                    if (!hit) return;

                    if (hit.closest('video, audio, iframe')) {
                        return;
                    }

                    const slider = hit.closest('input[type="range"]');
                    if (slider && !slider.disabled) {
                        e.preventDefault();
                        e.stopPropagation();
                        suppressNative = true;
                        activeSlider = slider;
                        updateBarrelSlider(slider, pt.x);
                        return;
                    }

                    const cboxEl = hit.closest('.coord-box');
                    if (cboxEl && !isCooldownActive()) {
                        const box = coordBoxes.find(b => b.el === cboxEl);
                        if (box) {
                            e.preventDefault();
                            e.stopPropagation();
                            suppressNative = true;
                            playReedSwitchClick();
                            const r0 = box.slotEls[0].getBoundingClientRect();
                            const r1 = box.slotEls[1].getBoundingClientRect();
                            const r2 = box.slotEls[2].getBoundingClientRect();
                            const d0 = Math.abs(pt.x - (r0.left + r0.width * 0.5));
                            const d1 = Math.abs(pt.x - (r1.left + r1.width * 0.5));
                            const d2 = Math.abs(pt.x - (r2.left + r2.width * 0.5));
                            const slotIdx = (d0 <= d1 && d0 <= d2) ? 0 : (d1 <= d2 ? 1 : 2);
                            focusCoordBox(box, slotIdx);
                            return;
                        }
                    }

                    const btn = hit.closest('button');
                    if (btn) {
                        e.preventDefault();
                        e.stopPropagation();
                        suppressNative = true;
                        if (!btn.disabled) {
                            clearPendingBtn();
                            pendingBtn = btn;
                            pendingBtn.classList.add('is-barrel-active');
                        }
                        return;
                    }

                    const link = hit.closest('a');
                    if (link) {
                        e.preventDefault();
                        e.stopPropagation();
                        suppressNative = true;
                        link.click();
                        return;
                    }

                    const field = hit.closest('input, textarea, select');
                    if (field && !field.disabled) {
                        if (e.target !== field) {
                            e.preventDefault();
                            e.stopPropagation();
                            suppressNative = true;
                            field.focus();
                            if (field.tagName === 'SELECT' && typeof field.showPicker === 'function') {
                                try { field.showPicker(); } catch (err) {}
                            }
                        }
                        return;
                    }

                    if (e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, .coord-box')) {
                        e.preventDefault();
                        e.stopPropagation();
                        suppressNative = true;
                        if (document.activeElement && typeof document.activeElement.blur === 'function') {
                            document.activeElement.blur();
                        }
                    }
                }, true);

                window.addEventListener('pointerup', (e) => {
                    if (!e.isTrusted) return;

                    if (activeSlider) {
                        e.preventDefault();
                        e.stopPropagation();
                        activeSlider.dispatchEvent(new Event('change', { bubbles: true }));
                        activeSlider = null;
                        clearSuppressSoon();
                        return;
                    }

                    if (pendingBtn) {
                        const btn = pendingBtn;
                        clearPendingBtn();
                        e.preventDefault();
                        e.stopPropagation();
                        const pt = mapBarrelPoint(e.clientX, e.clientY);
                        const hit = document.elementFromPoint(pt.x, pt.y);
                        if (hit && hit.closest('button') === btn && !btn.disabled) {
                            btn.click();
                        }
                        clearSuppressSoon();
                        return;
                    }

                    if (suppressNative) {
                        clearSuppressSoon();
                    }
                }, true);

                window.addEventListener('pointercancel', () => {
                    activeSlider = null;
                    clearPendingBtn();
                    clearSuppressSoon();
                }, true);

                window.addEventListener('mousedown', (e) => {
                    if (e.isTrusted && suppressNative) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true);

                window.addEventListener('click', (e) => {
                    if (!e.isTrusted) return;
                    if (suppressNative) {
                        e.preventDefault();
                        e.stopPropagation();
                        suppressNative = false;
                        return;
                    }
                    const pt = mapBarrelPoint(e.clientX, e.clientY);
                    const hit = document.elementFromPoint(pt.x, pt.y);
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, .coord-box')) {
                        if (!hit || !hit.closest('button, a, input, select, textarea, .coord-box')) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    }
                }, true);
            }

            function stopExpandTracking() {
                if (expandRaf !== null) {
                    cancelAnimationFrame(expandRaf);
                    expandRaf = null;
                }
                if (frameObserver) {
                    frameObserver.disconnect();
                    frameObserver = null;
                }
            }

            function hideExpandLines() {
                stopExpandTracking();
                const svg = document.getElementById('esz-expand-svg');
                if (svg) svg.classList.remove('is-visible');
            }

            function updateExpandLines() {
                const bezel = document.getElementById('esz-bezel');
                const svg = document.getElementById('esz-expand-svg');
                const target = document.getElementById('esz-axis-target');
                const frame = document.getElementById('signal-frame');
                if (!bezel || !svg || !target || !frame || !svg.classList.contains('is-visible')) return;

                const br = bezel.getBoundingClientRect();
                const tr = target.getBoundingClientRect();

                let fx1, fy1, fx2, fy2;
                const outWrap = document.getElementById('signal-output');

                if (frame.style.transform && frame.style.transform !== 'none' && frame.style.transform !== 'translate(0px, 0px) scale(1, 1)') {
                    const wr = outWrap.getBoundingClientRect();
                    fx1 = wr.left - br.left;
                    fy1 = wr.top - br.top;
                    fx2 = wr.right - br.left;
                    fy2 = wr.bottom - br.top;
                } else {
                    const fr = frame.getBoundingClientRect();
                    fx1 = fr.left - br.left;
                    fy1 = fr.top - br.top;
                    fx2 = fr.right - br.left;
                    fy2 = fr.bottom - br.top;
                }

                const sx1 = tr.left - br.left;
                const sy1 = tr.top - br.top;
                const sx2 = tr.right - br.left;
                const sy2 = tr.bottom - br.top;

                const tl = document.getElementById('exp-line-tl');
                const trLine = document.getElementById('exp-line-tr');
                const bl = document.getElementById('exp-line-bl');
                const brLine = document.getElementById('exp-line-br');

                if (tl) { tl.setAttribute('x1', sx1); tl.setAttribute('y1', sy1); tl.setAttribute('x2', fx1); tl.setAttribute('y2', fy1); }
                if (trLine) { trLine.setAttribute('x1', sx2); trLine.setAttribute('y1', sy1); trLine.setAttribute('x2', fx2); trLine.setAttribute('y2', fy1); }
                if (bl) { bl.setAttribute('x1', sx1); bl.setAttribute('y1', sy2); bl.setAttribute('x2', fx1); bl.setAttribute('y2', fy2); }
                if (brLine) { brLine.setAttribute('x1', sx2); brLine.setAttribute('y1', sy2); brLine.setAttribute('x2', fx2); brLine.setAttribute('y2', fy2); }
            }

            function activateSettledExpand(animateExpand) {
                stopExpandTracking();

                if (axisRaf !== null) {
                    cancelAnimationFrame(axisRaf);
                    axisRaf = null;
                }
                stopServoSound();

                const layer = document.getElementById('esz-axis-layer');
                const xLine = document.getElementById('esz-axis-x');
                const yLine = document.getElementById('esz-axis-y');
                const target = document.getElementById('esz-axis-target');
                const svg = document.getElementById('esz-expand-svg');
                const frame = document.getElementById('signal-frame');
                if (!layer || !target || !svg || !frame) return;

                if (pendingAxisTarget) {
                    if (xLine) xLine.style.left = pendingAxisTarget.xp + '%';
                    if (yLine) yLine.style.top = pendingAxisTarget.yp + '%';
                    target.style.left = pendingAxisTarget.xp + '%';
                    target.style.top = pendingAxisTarget.yp + '%';
                }

                layer.classList.add('is-active');
                layer.classList.add('is-locked-only');
                target.classList.remove('is-flashing');
                target.classList.add('is-settled');
                svg.classList.add('is-visible');

                if (typeof ResizeObserver !== 'undefined') {
                    frameObserver = new ResizeObserver(() => updateExpandLines());
                    frameObserver.observe(frame);
                }

                if (!animateExpand) {
                    updateExpandLines();
                    return;
                }

                playLockChirp();

                const tr = target.getBoundingClientRect();
                const fr = frame.getBoundingClientRect();

                if (fr.width > 0 && fr.height > 0) {
                    const tcx = tr.left + tr.width * 0.5;
                    const tcy = tr.top + tr.height * 0.5;
                    const fcx = fr.left + fr.width * 0.5;
                    const fcy = fr.top + fr.height * 0.5;
                    const dx = tcx - fcx;
                    const dy = tcy - fcy;
                    const sx = Math.max(0.02, tr.width / fr.width);
                    const sy = Math.max(0.02, tr.height / fr.height);

                    frame.style.transition = 'none';
                    frame.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
                    frame.style.opacity = '0.2';
                    void frame.offsetWidth;

                    frame.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease';
                    frame.style.transform = 'translate(0px, 0px) scale(1, 1)';
                    frame.style.opacity = '1';

                    const animStart = performance.now();
                    function trackFrame() {
                        if (performance.now() - animStart < 360) {
                            updateExpandLines();
                            expandRaf = requestAnimationFrame(trackFrame);
                        } else {
                            expandRaf = null;
                            frame.style.transition = '';
                            frame.style.transform = '';
                            frame.style.opacity = '';
                            requestAnimationFrame(() => {
                                updateExpandLines();
                            });
                        }
                    }
                    expandRaf = requestAnimationFrame(trackFrame);
                } else {
                    updateExpandLines();
                }
            }

            function stopAxisAnimation() {
                stopServoSound();
                pendingAxisTarget = null;
                if (axisRaf !== null) {
                    cancelAnimationFrame(axisRaf);
                    axisRaf = null;
                }
                hideExpandLines();
                const layer = document.getElementById('esz-axis-layer');
                const target = document.getElementById('esz-axis-target');
                if (layer) {
                    layer.classList.remove('is-active');
                    layer.classList.remove('is-locked-only');
                }
                if (target) {
                    target.classList.remove('is-flashing');
                    target.classList.remove('is-settled');
                }
            }

            function startAxisAnimation(xStr, yStr) {
                stopAxisAnimation();

                const bezel = document.getElementById('esz-bezel');
                const layer = document.getElementById('esz-axis-layer');
                const xLine = document.getElementById('esz-axis-x');
                const yLine = document.getElementById('esz-axis-y');
                const targetBox = document.getElementById('esz-axis-target');
                if (!bezel || !layer || !xLine || !yLine || !targetBox) return 0;

                const targetXPct = Math.max(0, Math.min(100, (parseFloat(xStr) / 70) * 100));
                const targetYPct = Math.max(0, Math.min(100, (parseFloat(yStr) / 70) * 100));
                pendingAxisTarget = { xp: targetXPct, yp: targetYPct };

                const w = Math.max(1, bezel.clientWidth);
                const h = Math.max(1, bezel.clientHeight);
                const dx = (targetXPct / 100) * w;
                const dy = (targetYPct / 100) * h;
                const dist = Math.hypot(dx, dy);
                const fullDiag = Math.hypot(w, h);
                const travelMs = fullDiag > 0 ? (dist / fullDiag) * 2000 : 0;

                function applyPos(xp, yp) {
                    xLine.style.left = xp + '%';
                    yLine.style.top = yp + '%';
                    targetBox.style.left = xp + '%';
                    targetBox.style.top = yp + '%';
                }

                layer.classList.add('is-active');

                if (travelMs <= 1) {
                    applyPos(targetXPct, targetYPct);
                    targetBox.classList.add('is-flashing');
                    return 0;
                }

                startServoSound(travelMs);
                applyPos(0, 0);
                const startTime = performance.now();

                function step() {
                    const elapsed = Math.max(0, performance.now() - startTime);
                    const p = Math.min(1, elapsed / travelMs);
                    applyPos(targetXPct * p, targetYPct * p);
